# Находки 29.07.2026. Ни одна не была задачей — все всплыли по дороге.
# Это и есть образец для §4.6: так выглядит заполненный журнал.
findings:
  - what: "канон называл «Агента 1С» образцом урезанных прав — «ровно 6 инструментов, ни одного опасного»"
    where: "CLAUDE.md против живого agent/get"
    impact: "у агента 45 инструментов, включая delete_agent, delete_profile и token_generate — агент-эталон безопасности может удалить другого агента аккаунта"
    severity: blocker
  - what: "token_generate есть у ВСЕХ пяти живых агентов"
    where: "живой agent/get по пяти агентам"
    impact: "любой из них может выписать токен доступа ко всему аккаунту; ни одному это не нужно для его задачи"
    severity: blocker
  - what: "MCP-адрес платформы пускает без токена"
    where: "https://api.extella.ai/mcp/"
    impact: "неавторизованный tools/list отдаёт весь каталог, включая agent_delete и token_generate; страница /claude сама приведёт туда незнакомых людей"
    severity: blocker
  - what: "обязательные тесты приватности жили в scratchpad и исчезли вместе с сессией"
    where: "scratchpad/pg_mandatory_tests.py, на который ссылается INTEGRATOR_HANDOFF_ANON_PHASE1.md"
    impact: "прогнать гейт перед деплоем Privacy Gateway было нечем; восстановлены как tests/test_privacy_gateway.py"
    severity: major
  - what: "два теста закрепляли нарушение канона вместо канона"
    where: "evolution-console-ux-simplicity (Ваши автоматизации), evolution-console-surface (свой переключатель языка)"
    impact: "правило пришло позже кода, и тесты какое-то время защищали именно то, что правило запрещает"
    severity: major
  - what: "preflight_ui.sh был красным на main и держал деплой всем"
    where: "расхождение kp_ask, kp_ingest, kp_install_pack между визардом и паком"
    impact: "визард ставится после пака и молча затирал у клиента более новую версию с мостом рантайма"
    severity: major
  - what: "гейт паспорта отвергал реальный id платформы"
    where: "check_agent_passport.py, PLATFORM_AGENT_ID_RE"
    impact: "правило требовало букву после agent_, а у живого агента id с двойным подчёркиванием — гейт запрещал описывать реального агента"
    severity: minor
  # 30.07.2026
  - what: "wz_agent_repo_check жил только на нашем аккаунте — в experts/ дистрибутива его не было"
    where: "витрина зовёт его до установки агента по ссылке; global: true не разъезжается между аккаунтами"
    impact: "у коллеги гейт отвечал unknown, установка шла без проверки паспорта, карточка агента не вставала никуда; класс «работает у нас — молча не работает у клиента». Закрыто: эксперт добавлен в experts/ визарда (551183b)"
    severity: major
  - what: "мы сами назвали открытый MCP-адрес дырой, не проверив, вызываются ли инструменты"
    where: "docs/handoffs/PACKAGE_FOR_TIMUR_30-07.md (первая редакция), WORKBOARD 29-30.07"
    impact: "формулировка «отдаёт agent_delete и token_generate» читалась как «посторонний может удалить агента»; живая проверка 30.07: tools/list открыт, но любой вызов упирается в «Failed to resolve dependency token/user_id». Реальных хвоста два: duckduckgo_search исполняется без токена (бесплатный поисковый прокси) и revoke_token принимает токен параметром (в коде не смотрели). Правило: страшный вывод проверяется вызовом, а не чтением списка"
    severity: major
  - what: "ПОПРАВКА к записи ниже: работа Codex по каталогу не терялась — её исключили сознательно"
    where: "toolbar/public/plugins_manager.html: коммит f2c0ef5 «fix: make catalog installs independent» — предок main, но catalog_tool_manage/catalog_capability_uninstall/unprovision в main отсутствуют; они живы в origin/feat/client-stability"
    impact: "проверено до конца: удаление сделал коммит 9a1a663 «Выборочный мерж feat/client-stability: инфраструктура Codex без их продуктовых выключателей» — то есть решение, а не потеря. Мой первый вывод «молча потеряно» был поспешным: я увидел отсутствие кода и не дошёл до коммита, который его убрал. Настоящий дефект другой: вместе с инфраструктурой приехал ГЕЙТ, требующий непринятого контракта, и был красным с 29.07 — непроходимый гейт сам является дефектом. Правило: прежде чем звать пропажу пропажей, найди коммит, который её сделал"
    severity: major
  - what: "витрина обещала установку CLI-инструментов на Windows, где она невозможна"
    where: "полка «Инструменты», все 7 карточек; /x/cap_install Конструктора ставит только через brew (ни winget, ни choco)"
    impact: "коллега на Windows жал «Установить» и получал немой отказ — наш самый дорогой класс. Закрыто: на Windows кнопка не обещает, а объясняет; гейт каталога теперь проверяет наличие этой защиты и краснеет при её удалении (проверено ломанием)"
    severity: major
  - what: "я объявил, что в русском ТРИ формы множественного числа — их четыре, и моя же самопроверка это узаконила"
    where: "перевод Библиотеки 30.07: locales/ru/*.json, записка Элле, доска; i18next берёт категорию из Intl.PluralRules (one/few/many/other)"
    impact: "без ключа _many интерфейс на числах 5-20 молча уезжал на английский fallback: «5 concepts» посреди русского экрана. Поймала Элла на вычитке. Хуже самой ошибки то, что моя автопроверка требовала «у каждого _one есть _few и _other» — она проверяла МОЮ ГИПОТЕЗУ, а не поведение библиотеки, и потому пропустила дефект по конструкции. Закрыто: гейт scripts/check-ru-plurals.js спрашивает категории у самого Intl.PluralRules. Правило: правило берут у того, кто его исполняет, а не у того, кто его помнит"
    severity: major
  - what: "автоподъём моста на Windows не вставал НИ У ОДНОГО нового пользователя — проверка «а есть ли задача» сама себя убивала"
    where: "toolbar/install-all.ps1: schtasks /Query перед /Create, под $ErrorActionPreference = Stop"
    impact: "на чистой машине задачи нет, schtasks пишет в stderr «ОШИБКА: Не удается найти указанный файл», PowerShell превращает stderr внешней программы в ТЕРМИНИРУЮЩУЮ ошибку — и мы улетали в catch ДО создания задачи. После перезагрузки мост не поднимался, плитки мертвы, а сообщение винило «указанный файл». Поймано живым прогоном у коллеги 30.07, у нас на macOS не воспроизводится в принципе. Правило: проверка существования не должна стоять там, где создание умеет /F"
    severity: blocker
  - what: "UnicodeEncodeError на последней строке установщика: работа сделана, установка выглядит рухнувшей"
    where: "scripts/register_app_cards.py (символ ↺) и ещё 37 файлов визарда, печатающих ✓ → ✗ ✅ в консоль Windows (cp1251)"
    impact: "коллега видит красную трассировку там, где всё прошло; доверие к установщику падает раньше, чем он успевает сработать. Чинить символы в 38 файлах = чинить следствие; причина закрыта одной строкой PYTHONIOENCODING/PYTHONUTF8 в установщике Windows"
    severity: major
  - what: "отказ установки называл проблему, но не давал коллеге выполнимого действия"
    where: "toolbar/check-one-identity.py: «Приведи их к одному и повтори установку» — четыре «✗» у Мергуль 30.07 (macOS)"
    impact: "человек, который не знает, где лежат ~/.extella/api_token.txt и ~/extella_wizard/app/config.json, получает совет, который не может выполнить — это тот же немой отказ, только многословный. Закрыто: расхождение чинится само (наш config.json равняется по клиенту Extella, чужой файл не трогаем), а на отозванном токене и на молчании сети — честный отказ с конкретным действием. Правило: «что делать» — это команда или кнопка, а не пожелание"
    severity: major
  - what: "автозапуск на Windows требовал прав администратора, которых у коллеги нет"
    where: "toolbar/install-all.ps1: schtasks /Create /SC ONLOGON → «Access is denied» на обычной учётке (Перизат, 30.07)"
    impact: "после первой перезагрузки мост не поднимался и все плитки становились мёртвыми. Ответ «запусти от администратора» негоден: половина не станет, а дефект молчаливый — человек узнает о нём через день. Закрыто запасным путём в папку автозагрузки ПОЛЬЗОВАТЕЛЯ (прав не требует), через .vbs, чтобы при каждом входе не мигало окно консоли. Проверка итога теперь принимает любой из двух механизмов. Правило: механизм автозапуска выбирается по правам, которые у человека ЕСТЬ, а не по тем, которые удобны нам"
    severity: blocker
  - what: "объявил «Библиотека говорит по-русски», проверив наличие слов в сборке, а не поведение экрана"
    where: "modules/library: словарь заведён в i18n, но подписи меню зашиты в Sidebar.tsx, подзаголовки собраны шаблоном в коде; 146 ключей из 565 не вызывались ни разу"
    impact: "полурусский экран с английским меню хуже честного английского — человек решает, что продукт сырой. Поймала Элла живым просмотром; моя проверка искала строку в артефакте и пропустить дефект была обязана: слова есть, их никто не спрашивает. Тот же класс, что три формы числа — проверял свою гипотезу, а не поведение. Правило: перевод считается сделанным, когда ЭКРАН показал его глазами, а не когда строка нашлась в файле"
    severity: major
  - what: "«установщики сделаны под macOS» оказалось неправдой: пять плиток к macOS не привязаны, барьером был bash"
    where: "toolbar/install-{connectors,predictive,targetolog,contract-agent,travel-agency}.sh — коллега на Windows получал 3 плитки из 8"
    impact: "мы месяц объясняли ограничение, которого не было. Все пять делают download/unzip/карточку/запуск — это Python, одинаковый везде; единственное настоящее расхождение платформ на всю установку — путь к python в виртуальной среде. Закрыто одной кроссплатформенной реализацией, которую зовут оба установщика. Правило: прежде чем объявлять ограничение платформы, проверь, что упирается в платформу, а не в язык скрипта"
    severity: major
  - what: "заглушка порта подставлялась только как значение, но не внутри строк"
    where: "install_local_plugin.py, launchCmd Подключений собран через «--port %d»"
    impact: "карточка выглядела правильной, а сервис поднимался бы на порту 999999 — молчаливая поломка у каждого, кто поставит Подключения. Поймано не глазами, а сверкой результата с прежним установщиком: единственный надёжный способ проверить перенос — сравнить с тем, что было"
    severity: major
  - what: "поверил тексту красных строк и поставил диагноз, не проверив, запускалась ли сама проверка"
    where: "разбор установки у Мергуль 30.07: три строки («устройство не зарегистрировано», «разные аккаунты», «автоподъём не встал») оказались следствием того, что установщик удалил свою рабочую папку до запуска проверок"
    impact: "потрачен вечер на лечение расхождения аккаунтов, которого не было; настоящая причина — одна строка rm -rf в середине скрипта. Сообщение УПАВШЕГО инструмента неотличимо от сообщения О НАХОДКЕ, если смотреть только на итоговую сводку. Правило: прежде чем верить отчёту проверки, убедись, что проверка выполнилась; и проси не сводку, а полный вывод. Закрыто гейтом check_installer_order.sh"
    severity: blocker
