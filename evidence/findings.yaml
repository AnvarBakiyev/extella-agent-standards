  - what: "поверил тексту красных строк и поставил диагноз, не проверив, запускалась ли сама проверка"
    where: "разбор установки у Мергуль 30.07: три строки («устройство не зарегистрировано», «разные аккаунты», «автоподъём не встал») оказались следствием того, что установщик удалил свою рабочую папку до запуска проверок"
