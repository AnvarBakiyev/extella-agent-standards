# Находки 29.07.2026. Ни одна не была задачей — все всплыли по дороге.
# Это и есть образец для §4.6: так выглядит заполненный журнал.
findings:
  - what: "канон называл «Агента 1С» образцом урезанных прав — «ровно 6 инструментов, ни одного опасного»"
    where: "CLAUDE.md против живого agent/get"
    impact: "у агента 45 инструментов, включая delete_agent, delete_profile и token_generate — агент-эталон безопасности может удалить другого агента аккаунта"
    severity: blocker
  - what: "token_generate есть у ВСЕХ пяти живых агентов"
    where: "живой agent/get по пяти агентам"
    impact: "любой из них может выписать токен доступа ко всему аккаунту; ни одному это не нужно для его задачи"
    severity: blocker
  - what: "MCP-адрес платформы пускает без токена"
    where: "https://api.extella.ai/mcp/"
    impact: "неавторизованный tools/list отдаёт весь каталог, включая agent_delete и token_generate; страница /claude сама приведёт туда незнакомых людей"
    severity: blocker
  - what: "обязательные тесты приватности жили в scratchpad и исчезли вместе с сессией"
    where: "scratchpad/pg_mandatory_tests.py, на который ссылается INTEGRATOR_HANDOFF_ANON_PHASE1.md"
    impact: "прогнать гейт перед деплоем Privacy Gateway было нечем; восстановлены как tests/test_privacy_gateway.py"
    severity: major
  - what: "два теста закрепляли нарушение канона вместо канона"
    where: "evolution-console-ux-simplicity (Ваши автоматизации), evolution-console-surface (свой переключатель языка)"
    impact: "правило пришло позже кода, и тесты какое-то время защищали именно то, что правило запрещает"
    severity: major
  - what: "preflight_ui.sh был красным на main и держал деплой всем"
    where: "расхождение kp_ask, kp_ingest, kp_install_pack между визардом и паком"
    impact: "визард ставится после пака и молча затирал у клиента более новую версию с мостом рантайма"
    severity: major
  - what: "гейт паспорта отвергал реальный id платформы"
    where: "check_agent_passport.py, PLATFORM_AGENT_ID_RE"
    impact: "правило требовало букву после agent_, а у живого агента id с двойным подчёркиванием — гейт запрещал описывать реального агента"
    severity: minor
  # 30.07.2026
  - what: "wz_agent_repo_check жил только на нашем аккаунте — в experts/ дистрибутива его не было"
    where: "витрина зовёт его до установки агента по ссылке; global: true не разъезжается между аккаунтами"
    impact: "у коллеги гейт отвечал unknown, установка шла без проверки паспорта, карточка агента не вставала никуда; класс «работает у нас — молча не работает у клиента». Закрыто: эксперт добавлен в experts/ визарда (551183b)"
    severity: major
  - what: "мы сами назвали открытый MCP-адрес дырой, не проверив, вызываются ли инструменты"
    where: "docs/handoffs/PACKAGE_FOR_TIMUR_30-07.md (первая редакция), WORKBOARD 29-30.07"
    impact: "формулировка «отдаёт agent_delete и token_generate» читалась как «посторонний может удалить агента»; живая проверка 30.07: tools/list открыт, но любой вызов упирается в «Failed to resolve dependency token/user_id». Реальных хвоста два: duckduckgo_search исполняется без токена (бесплатный поисковый прокси) и revoke_token принимает токен параметром (в коде не смотрели). Правило: страшный вывод проверяется вызовом, а не чтением списка"
    severity: major
  - what: "ПОПРАВКА к записи ниже: работа Codex по каталогу не терялась — её исключили сознательно"
    where: "toolbar/public/plugins_manager.html: коммит f2c0ef5 «fix: make catalog installs independent» — предок main, но catalog_tool_manage/catalog_capability_uninstall/unprovision в main отсутствуют; они живы в origin/feat/client-stability"
    impact: "проверено до конца: удаление сделал коммит 9a1a663 «Выборочный мерж feat/client-stability: инфраструктура Codex без их продуктовых выключателей» — то есть решение, а не потеря. Мой первый вывод «молча потеряно» был поспешным: я увидел отсутствие кода и не дошёл до коммита, который его убрал. Настоящий дефект другой: вместе с инфраструктурой приехал ГЕЙТ, требующий непринятого контракта, и был красным с 29.07 — непроходимый гейт сам является дефектом. Правило: прежде чем звать пропажу пропажей, найди коммит, который её сделал"
    severity: major
  - what: "витрина обещала установку CLI-инструментов на Windows, где она невозможна"
    where: "полка «Инструменты», все 7 карточек; /x/cap_install Конструктора ставит только через brew (ни winget, ни choco)"
    impact: "коллега на Windows жал «Установить» и получал немой отказ — наш самый дорогой класс. Закрыто: на Windows кнопка не обещает, а объясняет; гейт каталога теперь проверяет наличие этой защиты и краснеет при её удалении (проверено ломанием)"
    severity: major
  - what: "я объявил, что в русском ТРИ формы множественного числа — их четыре, и моя же самопроверка это узаконила"
    where: "перевод Библиотеки 30.07: locales/ru/*.json, записка Элле, доска; i18next берёт категорию из Intl.PluralRules (one/few/many/other)"
    impact: "без ключа _many интерфейс на числах 5-20 молча уезжал на английский fallback: «5 concepts» посреди русского экрана. Поймала Элла на вычитке. Хуже самой ошибки то, что моя автопроверка требовала «у каждого _one есть _few и _other» — она проверяла МОЮ ГИПОТЕЗУ, а не поведение библиотеки, и потому пропустила дефект по конструкции. Закрыто: гейт scripts/check-ru-plurals.js спрашивает категории у самого Intl.PluralRules. Правило: правило берут у того, кто его исполняет, а не у того, кто его помнит"
    severity: major
