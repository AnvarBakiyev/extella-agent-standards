  - what: "код плагинов тянулся по сети без всякой проверки целостности"
    where: "все локальные плагины комплекта: zip с файлового хоста, никакой контрольной суммы"
    impact: "подмена или порча архива по дороге прошла бы незамеченной и установилась на машины коллег. Закрыто полем sha256 в спецификации: расходится — установка останавливается. Заодно выяснено, что релиз в приватном репозитории коллегам недоступен (404), поэтому раздача остаётся на своём хосте, а целостность обеспечивается суммой из релиза"
    severity: major
  - what: "английский текст пережил три прохода перевода, потому что проверяли ключи, а не экран"
    where: "modules/library: 146 ключей не вызывались, при этом «0 of 0», «Select all», «Retry», «Default», «Notifications alt+T» рисовались мимо словаря"
    impact: "полурусский экран хуже честного английского: человек читает его как «продукт сырой». Ни счёт ключей (мой), ни вычитка словарей (Эллы) этот класс не ловят ПО КОНСТРУКЦИИ — слова есть, их просто никто не спрашивает. Предложение Эллы: проверять отрисованный текст. Сделано: гейт check-ui-hardcoded-text ищет текст, доходящий до экрана, и заведён в релизный путь; проверка живьём прошла по восьми экранам, включая подписи для экранного диктора — там и пряталось последнее («Notifications alt+T», глазами не видно). Правило: перевод считается сделанным, когда ЭКРАН показал его — и когда то, что человек СЛЫШИТ, тоже проверено"
    severity: major

