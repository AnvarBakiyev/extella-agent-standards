    severity: blocker
  - what: "унификация пяти установщиков стёрла бы данные клиента: политику уборки я сделал общей, а она у каждого своя"
    where: "toolbar/install_local_plugin.py: «чистить всегда, хранить data» вместо .state у Predictive Sales; плюс общая команда запуска вместо своей у Подключений и Predictive"
    impact: "при обновлении Predictive Sales исчезло бы .state — состояние клиента; два плагина из пяти не стартовали бы вовсе. Ни то, ни другое не проявилось бы в моих песочницах: папка была пустая, порты заняты рабочими копиями. Нашла СВЕРКА С ОРИГИНАЛАМИ построчно, а не запуск. Правило: перенос проверяется сравнением поведения со старым, а не тем, что новое «работает»"
