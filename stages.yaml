# Стадии стройки: сколько проверок применимо и когда.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ. Прежняя редакция стандарта знала один режим — «сразу как в проде», и
# каждый прогон платил полную цену: паспорт, манифест, бренд, дизайн, кабинет, реестр,
# журнал находок. На демонстрации клиенту это съедало больше времени, чем сам продукт,
# и в итоге тормозило главное — показать работающую вещь и услышать «да, это нужно».
#
# Отсюда три стадии. Границу между ними проводит НЕ настроение и не срок, а один факт:
#   • ничего не установлено у клиента, показываем сами → demo;
#   • стоит у одного клиента, работает на реальных данных → pilot;
#   • продаётся и ставится любому → prod.
# Установили клиенту — это уже pilot, как бы быстро это ни делалось.
#
# Формат машинный: `tools/stage_gates.py --stage demo --json` отдаёт список того, что
# применимо. Чат обязан спрашивать у него, а не пересказывать этот файл по памяти.

version: 1

stages:

  demo:
    название: Демо
    цель: >
      Показать клиенту работающий сценарий от начала до конца и получить решение,
      нужно ли это вообще. Мера успеха — «показали живьём», а не «прошли гейты».
    срок_ориентир: часы
    установлено_у_клиента: false
    обязательные_артефакты:
      - Один сценарий продукта проходит от начала до конца на живых вызовах.
      - "README на пять строк — что делает, как запустить, чего пока нет."
    обязательные_гейты:
      - check_code_canon        # канон платформы в коде: скоупы, X-Agent-Id, дубли имён
      - check_ui_api_contract   # интерфейс и сервер об одном: иначе кнопки не работают на показе
    сознательно_не_требуем:
      - Паспорт агента и автоматизации.
      - Манифест зависимостей, классы карточек, реестр способностей, кабинет.
      - Гейты бренда, дизайна, единственного источника, журнала находок, дрейфа.
      - Идемпотентность установщика, наблюдаемость, лимиты стоимости, владелец эксплуатации.
      - Тесты на сбойные пути. На демо достаточно, чтобы отказ был виден словами.

  pilot:
    название: Пилот
    цель: >
      Продукт стоит у одного клиента и работает на его реальных данных. Появляется
      цена ошибки: чужие данные, чужая машина, чужой рабочий день.
    срок_ориентир: дни
    установлено_у_клиента: true
    наследует: demo
    обязательные_артефакты:
      - Паспорт (agent или automation) со связью на platform_agent_id.
      - Привязка агента из EXTELLA_AGENT_ID в файле продукта.
      - Ожидание работы видно по docs/RULE_WAITING_STATES.md.
      - Установщик неинтерактивен и возвращает честный код.
    обязательные_гейты:
      - check_agent_passport      # или check_automation_passport — по типу продукта
      - check_agent_tools         # у клиентского агента нет delete_* без нужды
      - check_masking_policy      # если через продукт проходят персональные данные
      - check_state_contract      # если у продукта есть служба и /api/state
      - check_platform_client_copies
      - check_onboarding_copies
    сознательно_не_требуем:
      - Гейты бренда и дизайна: пилот показывает пользу, а не витрину.
      - Реестр способностей, кабинет, журнал находок, дрейф.
      - Релизный preflight и сверку установленного с раздачей.

  prod:
    название: Прод
    цель: >
      Продукт продаётся и ставится любому покупателю. Ошибка становится массовой и
      денежной: списание происходит после установки.
    срок_ориентир: недели
    установлено_у_клиента: true
    наследует: pilot
    обязательные_артефакты:
      - Требования docs/DEPLOY_REQUIREMENTS_AGENT.md разделы A–G целиком.
      - MANIFEST.yaml, класс карточки, паспорт с правами, журнал находок.
      - Владелец эксплуатации, наблюдаемость, потолок расходов.
    обязательные_гейты:
      - check_brand_copy
      - check_design_rule
      - check_single_source
      - check_findings_log
      - check_agent_drift
      - check_manifest_copies
      - check_surface_classes
      - check_agent_repo
      - check_ready_for_publish
      - register_new_agents
      - build_agent_cabinet
      - build_automation_cabinet
      - build_capability_registry
    сознательно_не_требуем: []

# Действует на ВСЕХ стадиях, включая демо. Это не проверки качества, а границы вреда:
# они дешёвые, и именно их нарушение делает быструю стройку опасной.
стоп_правила:
  - имя: внешняя_запись_только_черновиком
    текст: >
      Письма, платежи, публикации и любая запись наружу — черновик, отправляет человек.
      На демо это не мешает: показывать всё равно черновик.
  - имя: чужие_данные_не_на_демо
    текст: >
      Демонстрация идёт на синтетике или на своих данных. Реальные резюме, договоры и
      персональные данные клиента появляются только с пилота, когда есть маскирование.
  - имя: без_разрушающих_прав
    текст: >
      У клиентского агента нет delete_agent, delete_profile и прочих delete_* без
      написанной причины. Платформа копирует набор инструментов источника — проверять
      состав, а не надеяться.
  - имя: не_трогать_живое
    текст: >
      Продовые агенты, глобальные эксперты и данные клиента не меняются в ходе стройки
      демо. Нужен объект — создаётся свой, в своём скоупе.
  - имя: секреты_не_едут
    текст: >
      В архив продукта не попадают токены, ключи и внутренние документы: архив уезжает
      покупателю целиком.
  - имя: отказ_виден_словами
    текст: >
      Любой сбой доходит до человека текстом. Пустой экран и «ничего не произошло» —
      дефект на любой стадии: на демо он выглядит как сломанный продукт.
