# Стадии стройки: сколько проверок применимо и когда.
#
# ВЕРСИЯ 2 (решение Анвара 12.08.2026). Стадий ДВЕ, а не три: «стройка» и «прод».
# Прежние demo и pilot слиты — на живой практике между «показал клиенту» и «поставил
# клиенту» не оказалось реальной границы: клиент даёт свои данные уже на показ, и это
# нормально. Настоящие скачки цены ошибки — не ярлыки, а ФАКТЫ, поэтому внутри стройки
# добавки включаются фактами:
#   • появились данные клиента → маскирование при выходе с машины;
#   • продукт встал на чужую машину → паспорт, права, контракт состояния, копии канона.
# Прод остаётся прод: продукт раздаётся любому покупателю, ошибка массовая и денежная.
#
# Старые имена demo и pilot принимаются как синонимы build — чтобы не ломать хендоффы
# и preflight, написанные до этого решения.
#
# Формат машинный: `tools/stage_gates.py --stage build --json` отдаёт список того, что
# применимо. Чат обязан спрашивать у него, а не пересказывать этот файл по памяти.

version: 2

stages:

  build:
    название: Стройка
    цель: >
      Довести вещь от первой строчки до работающей у клиента. Мера успеха — решение
      клиента, а не зелёные гейты. Данные клиента на показе — нормально: клиент сам
      их даёт; граница не «чьи данные», а «куда они попадают» (см. стоп-правила).
    установлено_у_клиента: возможно
    обязательные_артефакты:
      - Один сценарий продукта проходит от начала до конца на живых вызовах.
      - "README на пять строк — что делает, как запустить, чего пока нет."
    обязательные_гейты:
      - check_code_canon        # канон платформы в коде: скоупы, X-Agent-Id, дубли имён
      - check_ui_api_contract   # интерфейс и сервер об одном: иначе кнопки не работают на показе
    факт_данные_клиента:
      - check_masking_policy    # ПДн маскируются при любом выходе с машины
    факт_чужая_машина:
      - check_agent_passport      # или check_automation_passport — по типу продукта
      - check_agent_tools         # у клиентского агента нет delete_* без нужды
      - check_state_contract      # если у продукта есть служба и /api/state
      - check_platform_client_copies
      - check_onboarding_copies
    сознательно_не_требуем:
      - Манифест зависимостей, классы карточек, реестр способностей, кабинет.
      - Гейты бренда, дизайна, единственного источника, журнала находок, дрейфа.
      - Наблюдаемость, лимиты стоимости, владелец эксплуатации, тесты на сбойные пути.

  prod:
    название: Прод
    цель: >
      Продукт продаётся и ставится любому покупателю. Ошибка становится массовой и
      денежной: списание происходит после установки.
    установлено_у_клиента: true
    наследует: build
    обязательные_артефакты:
      - Требования docs/DEPLOY_REQUIREMENTS_AGENT.md разделов, применимых типу продукта.
      - MANIFEST.yaml, класс карточки, паспорт с правами, журнал находок.
      - Владелец эксплуатации, наблюдаемость, потолок расходов.
    обязательные_гейты:
      - check_masking_policy
      - check_agent_passport
      - check_agent_tools
      - check_state_contract
      - check_platform_client_copies
      - check_onboarding_copies
      - check_brand_copy
      - check_design_rule
      - check_single_source
      - check_findings_log
      - check_agent_drift
      - check_manifest_copies
      - check_surface_classes
      - check_agent_repo
      - check_ready_for_publish
      - register_new_agents
      - build_agent_cabinet
      - build_automation_cabinet
      - build_capability_registry
    сознательно_не_требуем: []

# Действует на ВСЕХ стадиях. Это не проверки качества, а границы вреда: они дешёвые,
# и именно их нарушение делает быструю стройку опасной. Редакция 12.08.2026.
стоп_правила:
  - имя: внешняя_запись_только_черновиком
    текст: >
      Письма, платежи, публикации и любая запись наружу — черновик, отправляет человек.
      Показу это не мешает: показывать всё равно черновик.
  - имя: данные_клиента_только_в_контуре_клиента
    текст: >
      Данные клиента на показе и в стройке — можно: клиент сам их даёт. Нельзя другое —
      выносить их из контура: в облако платформы, в архив витрины (он уезжает любому
      покупателю), в глобальные скоупы, в демонстрацию другому клиенту. Выход данных
      с машины — только с маскированием.
  - имя: без_разрушающих_прав
    текст: >
      У клиентского агента нет delete_agent, delete_profile и прочих delete_* без
      написанной причины. Платформа копирует набор инструментов источника — проверять
      состав, а не надеяться.
  - имя: чужое_живое_не_трогать
    текст: >
      Агентов, экспертов и данные, которыми пользуются ДРУГИЕ (коллеги, другие продукты,
      другие клиенты), в ходе стройки не менять. Нужен объект — создаётся свой, в своём
      скоупе. При этом СВОЙ агент живёт одной жизнью от демо до прода — заморозки нет:
      менять можно всегда, но со следом и путём назад (инструкция файлом в репозитории,
      прошивка целиком, возможность отката).
  - имя: секреты_не_едут
    текст: >
      В архив продукта не попадают токены, ключи и внутренние документы: архив едет
      покупателю целиком. Ассеты страничного бандла публичны — там секретов тоже нет.
  - имя: отказ_виден_словами
    текст: >
      Любой сбой доходит до человека текстом. Пустой экран и «ничего не произошло» —
      дефект на любой стадии: на показе он выглядит как сломанный продукт.
