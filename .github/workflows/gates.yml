name: гейты

# ЗАЧЕМ. Гейты до сих пор гонялись только на машине автора. Значит, в общий
# репозиторий мог приехать код, который у автора зелёный, а у всех остальных
# падает — так у нас уже было с гейтом, искавшим файл вне репозитория.
# Теперь проверка идёт на чужой машине и на каждый push и pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Все гейты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Библиотеки, которые гейты ожидают на машине
        # pyyaml нужен гейту реестра. У автора он стоял давно, поэтому гейт был
        # зелёным только там — прогон на чистой машине это показал первым же разом.
        run: python -m pip install --quiet pyyaml

      - name: Прогнать все гейты
        run: bash tools/run_all_gates.sh

  connector:
    # ЗАЧЕМ ОТДЕЛЬНОЙ РАБОТОЙ. Установщик подключения — единственная часть, которую
    # человек запускает на СВОЁМ компьютере, а не у нас. README обещал «любую ОС»,
    # но CI знал только ubuntu (аудит 28.09.2026, F04/F11): про Windows и macOS мы
    # говорили без единого прогона. Здесь гоняется только самопроверка коннектора —
    # она не ходит в сеть и не трогает чужие конфиги.
    name: Коннектор на ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Самопроверка установщика подключения
        run: python tools/connect_mcp.py --selftest
      - name: Самопроверка канонной обвязки
        run: python tools/platform_client.py --selftest
