<meta charset="utf-8">
<title>Приёмка приложения</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --paper:#FAF9F5; --ink:#17150F; --surf:#FFFFFF; --line:#E7E2D6;
    --muted:#6E685C; --gold:#C57E33; --petrol:#2F6B66;
    --green:#2F6B66; --green-bg:#E8F1EF; --red:#B23A2E; --red-bg:#F6E7E4;
    --yellow:#9A6B18; --yellow-bg:#F4ECD8;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]){}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141310; --ink:#F4F1EA; --surf:#1C1A15; --line:#332F27;
      --muted:#A79F92; --green-bg:#12201E; --red-bg:#241512; --yellow-bg:#221B0E;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141310; --ink:#F4F1EA; --surf:#1C1A15; --line:#332F27;
    --muted:#A79F92; --green-bg:#12201E; --red-bg:#241512; --yellow-bg:#221B0E;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper); color:var(--ink); font:400 15px/1.55 var(--sans);
    padding:28px 22px; max-width:720px; margin:0 auto}
  .eyebrow{font:400 11px/1 var(--mono); letter-spacing:.28em; text-transform:uppercase;
    color:var(--petrol); margin-bottom:10px}
  h1{font:400 26px/1.15 var(--serif); letter-spacing:-.01em; margin-bottom:6px}
  .sub{color:var(--muted); font-size:14px; margin-bottom:22px; text-wrap:balance}
  .row{display:flex; gap:10px; align-items:stretch; flex-wrap:wrap}
  input{flex:1; min-width:220px; font:400 14px/1 var(--mono); padding:13px 14px;
    border:1px solid var(--line); border-radius:11px; background:var(--surf); color:var(--ink)}
  input:focus{outline:2px solid var(--gold); outline-offset:1px}
  button{font:600 15px/1 var(--sans); padding:13px 22px; border:0; border-radius:11px;
    cursor:pointer; color:#241606; white-space:nowrap;
    background:linear-gradient(180deg,#E3A455,var(--gold))}
  button:disabled{opacity:.55; cursor:default}
  .card{margin-top:22px; border:1px solid var(--line); border-radius:16px;
    background:var(--surf); overflow:hidden; display:none}
  .card.show{display:block}
  .head{padding:18px 20px; display:flex; align-items:center; gap:12px}
  .dot{width:12px; height:12px; border-radius:50%; flex:none}
  .verdict{font:600 18px/1.2 var(--sans)}
  .badge{margin-left:auto; font:400 12px/1 var(--mono); padding:6px 10px; border-radius:100px;
    border:1px solid var(--line); color:var(--muted)}
  .g{--c:var(--green); --cb:var(--green-bg)} .r{--c:var(--red); --cb:var(--red-bg)}
  .y{--c:var(--yellow); --cb:var(--yellow-bg)}
  .head{background:var(--cb)} .dot{background:var(--c)} .verdict{color:var(--c)}
  .reasons{padding:4px 20px 8px; list-style:none}
  .reasons li{padding:7px 0; border-top:1px solid var(--line); font-size:14px; color:var(--ink)}
  .reasons li.soft{color:var(--muted)}
  .reasons li b{color:var(--red)}
  figure{margin:0; padding:16px 20px 20px; border-top:1px solid var(--line)}
  figcaption{font:400 12px/1.4 var(--mono); color:var(--muted); margin-bottom:10px}
  img{width:100%; border:1px solid var(--line); border-radius:10px; display:block}
  .spin{display:none; align-items:center; gap:12px; margin-top:22px; color:var(--muted); font-size:14px}
  .spin.show{display:flex}
  .ring{width:20px; height:20px; border:2px solid var(--line); border-top-color:var(--gold);
    border-radius:50%; animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:var(--red); margin-top:16px; font-size:14px; display:none}
  .err.show{display:block}
  @media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>

<p class="eyebrow">Extella · приёмка</p>
<h1>Откроется ли у других?</h1>
<p class="sub">Откроем приложение на чистом стенде ровно как покупатель — на настоящем os.extella.ai — и честно покажем: зелёный или красный, со скриншотом того, что увидит человек.</p>

<div class="row">
  <input id="lid" placeholder="listing_id приложения" spellcheck="false"
         value="bbafb79c-742b-41b8-8ea9-ef5a75692fc6">
  <button id="go">Проверить</button>
</div>

<div class="spin" id="spin"><span class="ring"></span><span>Открываю на стенде как покупатель… это до ~2 минут.</span></div>
<p class="err" id="err"></p>

<div class="card" id="card">
  <div class="head" id="head">
    <span class="dot"></span>
    <span class="verdict" id="verdict"></span>
    <span class="badge" id="badge"></span>
  </div>
  <ul class="reasons" id="reasons"></ul>
  <figure id="fig" style="display:none">
    <figcaption>Что увидит человек на своём компьютере:</figcaption>
    <img id="shot" alt="скриншот окна приложения">
  </figure>
</div>

<script>
  // Этап 1: стенд задаётся адресом и ключом. На своём стенде — свой адрес; для
  // нашего демо — локальный туннель. Ключ закрывает стенд от улицы.
  var BENCH = window.BENCH_URL || "http://localhost:8799";
  var KEY   = window.BENCH_KEY || "";

  var CLS = {"зелёный":"g","жёлтый":"y","красный":"r","серый":"y"};
  var el = function(id){return document.getElementById(id)};

  el('go').onclick = function(){
    var lid = el('lid').value.trim();
    if(!lid) return;
    el('go').disabled = true;
    el('card').classList.remove('show');
    el('err').classList.remove('show');
    el('spin').classList.add('show');
    fetch(BENCH + "/priemka?lid=" + encodeURIComponent(lid), {
      headers: KEY ? {"X-Bench-Key": KEY} : {}
    }).then(function(r){ return r.json(); }).then(function(v){
      el('spin').classList.remove('show');
      el('go').disabled = false;
      if(v.ошибка){ el('err').textContent = "Стенд: " + v.ошибка; el('err').classList.add('show'); return; }
      render(v);
    }).catch(function(e){
      el('spin').classList.remove('show');
      el('go').disabled = false;
      el('err').textContent = "Не достучался до стенда: " + e.message;
      el('err').classList.add('show');
    });
  };

  function render(v){
    var head = el('head');
    head.className = "head " + (CLS[v.цвет] || "y");
    el('verdict').textContent = ({"зелёный":"Открывается","жёлтый":"Открывается с оговоркой",
      "красный":"Падает у чужого","серый":"Проба не смогла"})[v.цвет] || v.цвет;
    el('badge').textContent = v.бейдж || "";
    var ul = el('reasons'); ul.innerHTML = "";
    (v.жёсткие||[]).forEach(function(s){ var li=document.createElement('li'); li.innerHTML="<b>стоп:</b> "+s; ul.appendChild(li); });
    (v.мягкие||[]).forEach(function(s){ var li=document.createElement('li'); li.className="soft"; li.textContent="• "+s; ul.appendChild(li); });
    if(!ul.children.length){ var li=document.createElement('li'); li.className="soft"; li.textContent="Замечаний нет — окно нарисовалось как у покупателя."; ul.appendChild(li); }
    if(v.скриншот){ el('shot').src = v.скриншот; el('fig').style.display="block"; }
    else { el('fig').style.display="none"; }
    el('card').classList.add('show');
  }
</script>
