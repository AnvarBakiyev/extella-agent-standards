<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разработка на Extella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --a:#D4944A;--petrol:#5FA8A0;
  --bg:#0A0A0A;--s1:#141414;--s2:#181818;--s3:#1E1E1E;
  --bd:rgba(243,238,229,.09);--bd2:rgba(243,238,229,.18);
  --tx:#F5F3EE;--tx2:#C9C3B8;--tx3:#8C8C8C;
  --r:5px;
  --serif:'Source Serif 4','Lora',Georgia,serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
:root[data-lm="1"]{
  --a:#C57E33;--petrol:#2F6B66;
  --bg:#FAF9F5;--s1:#FFFFFF;--s2:#F5F3EC;--s3:#EFECE2;
  --bd:#D7E0DC;--bd2:#B7CEC9;
  --tx:#0A0A0A;--tx2:#2A2A2A;--tx3:#8C8C8C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 64px}

h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.2;letter-spacing:0;margin:0 0 10px}
h2{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.25;letter-spacing:0;margin:0}
h3{font-family:var(--serif);font-weight:600;font-size:15px;line-height:1.3;margin:20px 0 6px}
.lead{font-size:17px;color:var(--tx2);margin:0 0 4px}
p{margin:0 0 12px;color:var(--tx2)}
strong{color:var(--tx);font-weight:600}
a{color:var(--a);text-decoration:none;border-bottom:1px solid var(--bd2)}
ul,ol{margin:0 0 12px;padding-left:20px;color:var(--tx2)}
li{margin-bottom:6px}

.label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--tx3);margin:0 0 4px}
.search{width:100%;font-family:var(--sans);font-size:14px;color:var(--tx);background:var(--s1);
  border:1px solid var(--bd2);border-radius:var(--r);padding:9px 12px;margin:16px 0 6px}
.search::placeholder{color:var(--tx3)}
.count{font-family:var(--mono);font-size:11px;color:var(--tx3);min-height:16px;margin-bottom:14px}

section{background:var(--s1);border:1px solid var(--bd);border-radius:6px;margin-bottom:10px;overflow:hidden}
.head{display:flex;align-items:baseline;gap:10px;padding:14px 16px;cursor:pointer;user-select:none}
.head:hover{background:var(--s2)}
.num{font-family:var(--mono);font-size:11px;color:var(--tx3);min-width:16px}
.body{padding:0 16px 16px 42px;display:none}
section.open .body{display:block}
.chev{width:9px;height:9px;border-right:1px solid var(--tx3);border-bottom:1px solid var(--tx3);
  transform:rotate(45deg);flex:0 0 auto;margin-top:6px;transition:transform .12s}
section.open .chev{transform:rotate(-135deg)}

.cmd{position:relative;background:var(--s3);border:1px solid var(--bd);border-radius:var(--r);
  padding:34px 12px 11px;margin:8px 0 14px}
.cmd code{font-family:var(--mono);font-size:12px;color:var(--tx);white-space:pre-wrap;word-break:break-word;display:block}
.copy{position:absolute;top:8px;right:8px;font-family:var(--sans);font-size:12px;
  color:var(--tx2);background:transparent;border:1px solid var(--bd2);border-radius:4px;
  padding:4px 9px;cursor:pointer}
.copy:hover{color:var(--tx);border-color:var(--a)}
.copy[data-done="1"]{color:var(--petrol);border-color:var(--petrol)}
.copy-note{font-size:12px;color:var(--tx3);margin:-8px 0 12px}

code.inl{font-family:var(--mono);font-size:12px;background:var(--s3);border-radius:4px;padding:1px 5px;color:var(--tx)}

.note{border-left:2px solid var(--a);padding:2px 0 2px 12px;margin:12px 0;font-size:13px;color:var(--tx2)}
.note strong{color:var(--tx)}
.trap{border-left:2px solid var(--petrol);padding:2px 0 2px 12px;margin:12px 0;font-size:13px;color:var(--tx2)}

table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--bd);color:var(--tx2);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--tx3);font-weight:400}
td strong{color:var(--tx)}

.empty{font-size:13px;color:var(--tx3);padding:14px 2px}
footer{margin-top:26px;font-size:13px;color:var(--tx3)}
footer a{color:var(--a)}
.status{font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:10px}
.status b{color:var(--petrol);font-weight:500}
mark{background:rgba(212,148,74,.22);color:var(--tx);border-radius:4px;padding:0 2px}
:root[data-lm="1"] mark{background:rgba(197,126,51,.2)}
</style>
</head>
<body>
<div class="wrap">

  <div id="шапка"></div>

  <input class="search" id="q" type="search" placeholder="Найти: токен, права, магазин, устройство, ошибка" autocomplete="off">
  <div class="count" id="count"></div>
  <div class="empty" id="empty" style="display:none">Ничего не нашлось. Сотри запрос или напиши короче — одним словом.</div>

  <div id="разделы"></div>

  <footer>
    <p>Полный канон, машинные проверки и разборы поломок —
    <a href="https://github.com/AnvarBakiyev/extella-agent-standards" target="_blank" rel="noopener">github.com/AnvarBakiyev/extella-agent-standards</a>.
    Проверки там же: они и есть спецификация, а не текст рядом с ней.</p>
    <div class="status" id="статус"></div>
  </footer>

</div>

<script>
// Содержимое подставляется сборщиком из content.json — единственного источника правды.
// Оболочка отдаётся магазином, текст живёт в репозитории и обновляется коммитом.
var СНИМОК = /*СОДЕРЖИМОЕ*/{"версия_содержимого":"2026-08-13.2","шапка":{"метка":"руководство","заголовок":"Разработка на Extella","лид":"Как построить агента, довести его до магазина и не сломать чужое по дороге","вступление":"Это не стиль-гайд, а рабочий канон: почти каждое правило здесь куплено настоящей поломкой. Быстрее всего — отдать это своему Claude Code или Codex со словами «настройся по этой инструкции и сделай мне такого-то агента». Он выполнит, а ты прочитаешь то, что тебе важно."},"разделы":[{"номер":"01","заголовок":"С чего начать","тело":"<p>Порядок один и тот же, кем бы ты ни был. Отличается только объём проверок, и его считает\n      машина, а не человек.<\/p>\n      <h3>Токен — это действие человека<\/h3>\n      <p>Токен выдаёт себе владелец аккаунта в интерфейсе Extella. Ассистент его не создаёт и не\n      просит переслать в чат: токен полноправный, им можно удалить агента.<\/p>\n      <h3>Подключение Extella как MCP-сервера<\/h3>\n      <div class=\"cmd\"><button class=\"copy\">Копировать<\/button><code>claude mcp add --transport http extella https://api.extella.ai/mcp/ --header \"X-Auth-Token: ТВОЙ_ТОКЕН\"<\/code><\/div>\n      <p class=\"copy-note\">Подставь свой токен вместо заглушки. В историю чата он попадать не должен.<\/p>\n      <h3>Проверка связи фактом<\/h3>\n      <p>Первым делом попроси список агентов. Пустой список — это ответ, а не поломка: значит агентов\n      ещё нет. Ошибка авторизации — значит токен или заголовок неверные.<\/p>\n      <h3>Сколько проверок применимо именно тебе<\/h3>\n      <div class=\"cmd\"><button class=\"copy\">Копировать<\/button><code>python3 tools/stage_gates.py --stage build --json<\/code><\/div>\n      <p>Стадий две. <strong>Стройка<\/strong> — от первой строки до работающей вещи у заказчика:\n      две обязательных проверки. <strong>Прод<\/strong> — продаётся любому покупателю, ошибка стоит\n      денег: двадцать одна. Остальное включают <strong>факты<\/strong>, а не ярлыки: появились данные\n      клиента — включается маскирование; продукт едет на чужую машину — паспорт, узкие права,\n      контракт состояния.<\/p>"},{"номер":"02","заголовок":"Канон платформы","тело":"<p>Шесть вещей, нарушение которых ломается не у тебя, а у клиента.<\/p>\n      <h3>Модель одна для всех клиентских агентов<\/h3>\n      <p>Платформенная модель, а не свой ключ от чужого поставщика. Продукт, показанный на чужой\n      модели, — нечестный тест: у покупателя он поведёт себя иначе.<\/p>\n      <h3>Скоуп решает всё<\/h3>\n      <p>У каждого агента свой мир. Эксперт, который зовётся и работает, может не показываться в\n      списке — и наоборот. Проверять доступность именем у конкретного агента, а не по флагу и не\n      по списку.<\/p>\n      <div class=\"trap\"><strong>Ловушка:<\/strong> признак «общий» не означает «видят все агенты».\n      Есть живой эксперт с этим признаком, которого два других агента не находят вовсе.<\/div>\n      <h3>Если код зовёт эксперта — эксперт обязан ехать с кодом<\/h3>\n      <p>Самый частый класс «работает у нас, молча не работает у клиента»: движок жил у автора, а\n      клиентам раскладывался код, который в него стучится.<\/p>\n      <h3>Свежий агент рождается с полными правами<\/h3>\n      <p>Включая удаление других агентов. Сузить инструменты — обязательный шаг, а не улучшение.\n      У нас уже приезжал продукт, умевший снести агента покупателя.<\/p>\n      <h3>Отложенный прогон возвращает номер задачи<\/h3>\n      <p>Таймаут не означает провал. Забирай результат по номеру задачи, а не считай вызов\n      неудачным: на этом теряли дни.<\/p>\n      <h3>Факт о платформе старше суток — перепроверяй<\/h3>\n      <p>Живая схема менялась дважды за один день. Вчерашняя запись — не основание остановить\n      работу.<\/p>"},{"номер":"03","заголовок":"Порядок стройки","тело":"<p><strong>Сначала способность, интерфейс сверху.<\/strong> Строй умение через агента и его\n      экспертов, докажи живым прогоном, и только потом делай поверхность.<\/p>\n      <p>Причина простая: поверхность меняется чаще способности. Готовая способность переживает\n      смену поверхности без переделки, а красивый экран без доказанной способности переделывается\n      целиком. Старую поверхность держи запасной, пока новая не доказана живым сценарием.<\/p>\n      <h3>Роль агента живёт файлом<\/h3>\n      <p>Инструкция — файл в репозитории, прошивается целиком, у изменения есть версия и путь\n      назад. Менять своего агента можно всегда. Запрещено не изменение, а изменение бесследное —\n      и любое изменение чужого живого.<\/p>\n      <h3>Проверка обязана уметь падать<\/h3>\n      <p>Сломай нарочно одно поле и убедись, что сверка это увидела. Проверка, которая не может\n      провалиться, хуже отсутствия проверки: она даёт ложную уверенность.<\/p>"},{"номер":"04","заголовок":"Путь до магазина","тело":"<p>Листинг собирается из независимых частей, и брать можно любой поднабор. Развилка\n      «архив или страница» — ложная: одна версия несёт и то, и другое.<\/p>\n      <table>\n        <tr><th>часть<\/th><th>лимит<\/th><th>что даёт покупателю<\/th><\/tr>\n        <tr><td><strong>Агент<\/strong><\/td><td>—<\/td><td>разворачивается его собственный агент со всеми правилами, памятью и экспертами<\/td><\/tr>\n        <tr><td><strong>Архив<\/strong><\/td><td>до 100 МБ<\/td><td>локальная часть: служба, данные, ключи, доступ к файлам<\/td><\/tr>\n        <tr><td><strong>Страница<\/strong><\/td><td>HTML до 3 МБ, zip до 20 МБ<\/td><td>окно интерфейса и ярлык на столе<\/td><\/tr>\n        <tr><td><strong>Установщик<\/strong><\/td><td>—<\/td><td>эксперт, который разворачивает локальную часть<\/td><\/tr>\n        <tr><td><strong>Иконка<\/strong><\/td><td>до 5 МБ<\/td><td>значок в магазине<\/td><\/tr>\n      <\/table>\n      <p>Решает один вопрос: <strong>где живут данные<\/strong>. Нельзя уезжать с машины — значит\n      есть архив. Всё остальное — следствие.<\/p>\n\n      <h3>Права приложения объявляются при публикации<\/h3>\n      <div class=\"note\"><strong>Пустые права = продукт молча мёртв.<\/strong> Страница откроется\n      целой, а каждый вызов агента вернёт отказ. По умолчанию не выдаётся ничего.<\/div>\n      <p>Проси минимум: покупатель читает список прав до покупки и может отозвать их в любой\n      момент. Значит отказ в правах — <strong>штатное состояние<\/strong> продукта, которое надо\n      назвать словами, а не показать пустым экраном.<\/p>\n      <p>Отдельное право — запуск на компьютере покупателя. Без него закрепление за устройством\n      вырезается, и эксперт уходит в облако: там нет ни локальных файлов, ни ключей.<\/p>\n\n      <h3>Скорость решает архитектуру<\/h3>\n      <p>Вызов со страницы до устройства — <strong>от тринадцати до семнадцати секунд<\/strong>.\n      Локальный мост отвечал за шесть миллисекунд. Значит не двадцать мелких запросов, а\n      <strong>один вызов-снимок<\/strong>: собери состояние на устройстве и отдай одним ответом.\n      Перенос «как есть» даёт неработоспособный интерфейс.<\/p>\n\n      <h3>Порядок сдачи<\/h3>\n      <ol>\n        <li>архив без секретов — он уезжает покупателю целиком;<\/li>\n        <li>права объявлены и минимальны;<\/li>\n        <li>предрелиз: продукт виден только автору;<\/li>\n        <li>покупка себе и установка;<\/li>\n        <li><strong>первый запуск чистым состоянием<\/strong> — без твоих конфигов;<\/li>\n        <li>один сценарий живьём от начала до конца;<\/li>\n        <li>остановка. Кнопку публикации жмёт человек: это необратимо и видно всем.<\/li>\n      <\/ol>\n      <p>Ключи самого клиента — внешние сервисы, номера, учётные системы — <strong>не\n      блокер<\/strong>. Продукт без них обязан быть честным, а не сломанным: попроси ключ в\n      онбординге и скажи словами, что пока не подключено.<\/p>"},{"номер":"05","заголовок":"Границы, которые не переходят","тело":"<p>Быстро — не значит «можно всё». Эти шесть правил дешёвые, и именно их нарушение делает\n      быструю работу опасной.<\/p>\n      <table>\n        <tr><td><strong>Наружу — только черновики<\/strong><\/td><td>письма, платежи, публикации готовит агент, отправляет человек<\/td><\/tr>\n        <tr><td><strong>Данные клиента — в контуре клиента<\/strong><\/td><td>на показе можно: клиент сам их дал. Нельзя выносить в облако, в архив магазина, в чужой показ<\/td><\/tr>\n        <tr><td><strong>Без разрушающих прав<\/strong><\/td><td>никакого удаления у клиентского агента без написанной причины<\/td><\/tr>\n        <tr><td><strong>Чужое живое не трогать<\/strong><\/td><td>свой агент развивается со следом и откатом, чужие объекты не меняются вовсе<\/td><\/tr>\n        <tr><td><strong>Секреты не едут<\/strong><\/td><td>архив уезжает покупателю целиком, ассеты страницы публичны<\/td><\/tr>\n        <tr><td><strong>Отказ виден словами<\/strong><\/td><td>пустой экран — дефект на любой стадии: человек решит, что продукт сломан<\/td><\/tr>\n      <\/table>"},{"номер":"06","заголовок":"Грабли, на которые наступают все","тело":"<h3>Подстановка в видимом тексте<\/h3>\n      <p>Платформа заменяет свои метки настоящими значениями. Если написать такую метку в\n      <strong>видимом<\/strong> тексте страницы, пользователь увидит чужой токен вместо примера.\n      Литералы пиши мнемониками.<\/p>\n      <h3>Асимметрия записи и чтения<\/h3>\n      <p>Эксперт пишется одним набором полей, а читается другим. Сверка, написанная по интуиции,\n      читает пустоту и <strong>всегда зелёная<\/strong>. Сравнивай по содержимому.<\/p>\n      <h3>Страница, добавленная после покупки<\/h3>\n      <p>Ярлык ставится в момент установки. Добавил интерфейс позже — на столе останется только\n      агент, и человек решит, что окна нет. Лечится переустановкой.<\/p>\n      <h3>Ассеты берутся от последней версии<\/h3>\n      <p>Покупатель закреплён за своей версией страницы, а картинки и стили получает от свежей.\n      Значит менять их можно только совместимо, иначе сломаешь тех, кто купил раньше.<\/p>\n      <h3>Установщик, который ждёт ответа<\/h3>\n      <p>Любой вопрос в консоли — повисшая покупка. Установщик неинтерактивен и возвращает\n      честный код: списание происходит после установки, поэтому честный отказ дешевле молчания.<\/p>\n      <h3>Работа во временной папке<\/h3>\n      <p>Ветка, живущая только в системной временной папке, исчезает вместе с ней. Пушь сразу,\n      а не в конце: так почти потерялся целый день работы.<\/p>\n      <h3>Магазин принадлежит токену, а не аккаунту<\/h3>\n      <p>Опубликовал приложение, открыл свой магазин на том же аккаунте — и не увидел его.\n      Причина: владелец определяется <strong>токеном<\/strong>, и рабочий стол, покупки и\n      публикации изолированы по нему. У одного аккаунта столько параллельных магазинов, сколько\n      у него токенов, а их легко набирается десяток.<\/p>\n      <div class=\"trap\"><strong>Как отличить от поломки:<\/strong> одно и то же имя чуть\n      различается на экране и в ответе API, а число публикаций расходится в разы. Значит это\n      разные контейнеры, а не пропавший продукт. Публикуй тем же токеном, которым владелец\n      работает в интерфейсе, и сверь список перед публикацией.<\/div>"},{"номер":"07","заголовок":"Готовый промпт для ассистента","тело":"<p>Скопируй и отдай своему Claude Code или Codex. Дальше он сделает сам.<\/p>\n      <div class=\"cmd\"><button class=\"copy\">Копировать<\/button><code>Настройся по стандартам Extella и построй мне агента.\n\n1. Склонируй github.com/AnvarBakiyev/extella-agent-standards и прочитай README.md целиком — это единый вход. Потом DEPLOY_REQUIREMENTS.md раздел H и BUILD_STAGES.md.\n2. Токен я дам сам. Не проси переслать его в чат и не создавай своих.\n3. Объяви стадию и факты, объём проверок возьми у машины: python3 tools/stage_gates.py --stage build --json\n4. Строй сначала способность через агента и его экспертов, докажи живым прогоном, интерфейс делай сверху.\n5. Сузь инструменты агента — свежий агент рождается с правом удалять других.\n6. Доведи до предрелиза сам: права объявлены, покупка себе, установка, первый запуск чистым состоянием. Остановись перед публикацией — эту кнопку нажму я.\n7. Отчёт тремя частями: закрыл / не моё / не закрыл честно.\n\nСтоп-правила: наружу только черновики, данные клиента только в контуре клиента, без разрушающих прав, чужое живое не трогать, секреты не едут в архив, отказ виден словами.<\/code><\/div>"},{"номер":"08","заголовок":"Обновление без передеплоя","тело":"<p>Страничный продукт можно менять, не выпуская версию. Проверено живьём\nна уже опубликованном листинге: текст в окне обновился, номер версии не изменился, кнопку\nпубликации жать не пришлось, у поставивших ничего не сломалось.<\/p>\n<table>\n<tr><th>что меняем<\/th><th>как<\/th><th>что нужно от человека<\/th><\/tr>\n<tr><td><strong>Текст и данные<\/strong><\/td><td>коммит в файл содержимого, страница читает его из репозитория<\/td><td>ничего<\/td><\/tr>\n<tr><td><strong>Саму оболочку<\/strong><\/td><td>замена страницы у той же версии<\/td><td>приложить файл<\/td><\/tr>\n<tr><td><strong>Код на устройстве<\/strong><\/td><td>скачать свежий архив продукта из магазина<\/td><td>подтвердить обновление<\/td><\/tr>\n<\/table>\n<p>Первый способ и есть настоящий «поправил у себя — обновилось у всех»: оболочка лежит в\nмагазине и меняется редко, а содержимое живёт рядом с кодом.<\/p>\n<div class=\"note\"><strong>Условие честности:<\/strong> страница обязана работать и без сети.\nВстроенный снимок рисуется мгновенно, свежее подтягивается в фоне. Иначе продукт зависит от\nчужой доступности и однажды покажет пустой экран.<\/div>\n<div class=\"trap\"><strong>Присланное из сети — данные, а не код.<\/strong> Перед вставкой\nвырезай скрипты и обработчики. Иначе обновление содержимого превращается в канал доставки\nчужого кода в продукт.<\/div>\n<p>Для кода на машине покупателя правило строже: обновляться <strong>по тегу релиза<\/strong>,\nсверять контрольную сумму и говорить словами, что изменилось. Обновление, которое приезжает\nмолча и из плавающей ветки, — это не удобство, а доставка чего угодно в чужой контур.<\/p>"}]}/*КОНЕЦ*/;
var ИСТОЧНИК = "https://raw.githubusercontent.com/AnvarBakiyev/extella-agent-standards/main/store_app/content.json";

(function(){
  var текущее = СНИМОК;

  function applyTheme(t){
    if(t === 'light') document.documentElement.setAttribute('data-lm','1');
    else document.documentElement.removeAttribute('data-lm');
  }
  window.addEventListener('message', function(e){
    var d = e.data || {};
    if (d.type === 'etb_theme') applyTheme(d.theme);
    if (d.type === 'etb_init')  applyTheme(d.theme);
  });
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) applyTheme('light');

  // Присланное из сети — данные, а не код: скрипты и обработчики вырезаются.
  function обезвредить(html){
    return String(html)
      .replace(/<script[\s\S]*?<\/script>/gi, '')
      .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .replace(/javascript:/gi, '');
  }
  function текстом(s){
    var d = document.createElement('div'); d.textContent = String(s == null ? '' : s);
    return d.innerHTML;
  }

  function нарисовать(содержимое){
    var ш = содержимое["шапка"] || {};
    document.getElementById('шапка').innerHTML =
      '<p class="label">' + текстом(ш["метка"]) + '</p>' +
      '<h1>' + текстом(ш["заголовок"]) + '</h1>' +
      '<p class="lead">' + текстом(ш["лид"]) + '</p>' +
      '<p>' + текстом(ш["вступление"]) + '</p>';

    var куски = (содержимое["разделы"] || []).map(function(р, i){
      return '<section' + (i === 0 ? ' class="open"' : '') + '>' +
        '<div class="head"><span class="num">' + текстом(р["номер"]) + '</span>' +
        '<h2>' + текстом(р["заголовок"]) + '</h2><span class="chev"></span></div>' +
        '<div class="body">' + обезвредить(р["тело"]) + '</div></section>';
    });
    document.getElementById('разделы').innerHTML = куски.join('');
    привязать();
  }

  function привязать(){
    [].slice.call(document.querySelectorAll('section')).forEach(function(s){
      s.querySelector('.head').onclick = function(){ s.classList.toggle('open'); };
    });
  }

  function статус(текст, свежее){
    document.getElementById('статус').innerHTML =
      свежее ? ('содержимое <b>' + текстом(текст) + '</b>') : ('содержимое ' + текстом(текст));
  }

  document.addEventListener('click', function(e){
    var b = e.target;
    if (!b.classList || !b.classList.contains('copy')) return;
    var поле = b.parentNode.querySelector('code');
    if (!поле) return;
    var текст = поле.textContent, было = 'Копировать';
    function ok(){ b.textContent = 'Скопировано'; b.dataset.done = '1';
      setTimeout(function(){ b.textContent = было; b.dataset.done = ''; }, 1600); }
    function нет(){ b.textContent = 'Выдели и скопируй сам'; b.dataset.done = '';
      setTimeout(function(){ b.textContent = было; }, 2600); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(текст).then(ok, нет);
    } else {
      try {
        var ta = document.createElement('textarea');
        ta.value = текст; document.body.appendChild(ta); ta.select();
        var done = document.execCommand('copy'); document.body.removeChild(ta);
        done ? ok() : нет();
      } catch (err) { нет(); }
    }
  });

  function подсветить(корень, слово){
    var walker = document.createTreeWalker(корень, NodeFilter.SHOW_TEXT, {
      acceptNode: function(n){
        if (!n.nodeValue || n.nodeValue.toLowerCase().indexOf(слово) < 0) return NodeFilter.FILTER_REJECT;
        var p = n.parentNode.nodeName;
        if (p === 'SCRIPT' || p === 'STYLE' || p === 'MARK' || p === 'CODE') return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var узлы = [], n;
    while ((n = walker.nextNode())) узлы.push(n);
    узлы.forEach(function(узел){
      var текст = узел.nodeValue, низ = текст.toLowerCase(), поз = 0, i,
          куски = document.createDocumentFragment();
      while ((i = низ.indexOf(слово, поз)) >= 0) {
        if (i > поз) куски.appendChild(document.createTextNode(текст.slice(поз, i)));
        var m = document.createElement('mark');
        m.textContent = текст.slice(i, i + слово.length);
        куски.appendChild(m);
        поз = i + слово.length;
      }
      if (поз < текст.length) куски.appendChild(document.createTextNode(текст.slice(поз)));
      узел.parentNode.replaceChild(куски, узел);
    });
  }

  var q = document.getElementById('q');
  q.addEventListener('input', function(){
    var слово = q.value.trim().toLowerCase();
    нарисовать(текущее);                       // перерисовка снимает прошлую подсветку
    var разделы = [].slice.call(document.querySelectorAll('section'));
    if (!слово) {
      document.getElementById('count').textContent = '';
      document.getElementById('empty').style.display = 'none';
      return;
    }
    var найдено = 0;
    разделы.forEach(function(s){
      var есть = s.textContent.toLowerCase().indexOf(слово) >= 0;
      s.style.display = есть ? '' : 'none';
      s.classList.toggle('open', есть);
      if (есть) { найдено++; подсветить(s, слово); }
    });
    document.getElementById('count').textContent = найдено ? ('разделов: ' + найдено) : '';
    document.getElementById('empty').style.display = найдено ? 'none' : '';
  });

  // Первый кадр — из встроенного снимка, мгновенно и без сети.
  нарисовать(текущее);
  статус((СНИМОК && СНИМОК["версия_содержимого"]) || 'встроенное');

  // Дальше в фоне: если в репозитории новее — подменяем молча, но отмечаем это.
  fetch(ИСТОЧНИК, {cache: 'no-cache'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(свежее){
      if (!свежее || !свежее["разделы"] || !свежее["разделы"].length) return;
      var было = (СНИМОК && СНИМОК["версия_содержимого"]) || '';
      if (свежее["версия_содержимого"] === было) return;
      текущее = свежее;
      var слово = q.value.trim();
      нарисовать(текущее);
      if (слово) { q.dispatchEvent(new Event('input')); }
      статус('обновлено до ' + (свежее["версия_содержимого"] || 'свежего'), true);
    })
    .catch(function(){ /* сети нет — снимок уже показан, терять нечего */ });
})();
</script>
