<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доска</title>
<style>
:root{--a:#D4944A;--petrol:#5FA8A0;--bg:#0A0A0A;--s1:#141414;
  --bd:rgba(243,238,229,.18);--tx:#F5F3EE;--tx2:#C9C3B8;--tx3:#8C8C8C}
:root[data-lm="1"]{--a:#C57E33;--petrol:#2F6B66;--bg:#FAF9F5;--s1:#FFFFFF;
  --bd:#B7CEC9;--tx:#0A0A0A;--tx2:#2A2A2A;--tx3:#8C8C8C}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,sans-serif}
#доска{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.запасной{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.карточка{max-width:520px}
h1{font:600 24px/1.2 Georgia,serif;margin:0 0 8px}
p{color:var(--tx2);margin:0 0 14px}
.btn{display:inline-block;font:600 15px system-ui;color:#0A0A0A;background:var(--a);
  border:0;border-radius:5px;padding:12px 20px;cursor:pointer;text-decoration:none}
.тихо{font:11px ui-monospace,Menlo,monospace;color:var(--tx3);margin-top:16px}
</style>
</head>
<body>
<iframe id="доска"
        allow="clipboard-read; clipboard-write"></iframe>

<div class="запасной" id="запасной">
  <div class="карточка">
    <h1>Доска</h1>
    <p id="сообщение">Открываю доску…</p>
    <a class="btn" id="кнопка" href="http://localhost:34785/" target="_blank"
       rel="noopener" style="display:none">Открыть доску в отдельном окне</a>
    <div class="тихо" id="тихо"></div>
  </div>
</div>

<script>
// ЗАЧЕМ ЗАПАСНОЙ ПУТЬ. Оболочка ОС открывает приложение в iframe внутри страницы
// на https (проверено чтением desktop.js). Доска живёт на http://localhost — и
// поведение тут зависит от движка: Chromium считает локальный адрес доверенным и
// пускает, Safari блокирует смешанное содержимое. Поэтому страница не гадает: она
// сначала проверяет доступность доски запросом, а если та недоступна — предлагает
// открыть её отдельным окном: переход верхнего уровня на http не блокирует никто.
function тема(t){
  if (t === 'light') document.documentElement.setAttribute('data-lm','1');
  else document.documentElement.removeAttribute('data-lm');
}
window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type === 'etb_theme' || d.type === 'etb_init') тема(d.theme);
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) тема('light');

var АДРЕС = 'http://localhost:34785/';
var рамка = document.getElementById('доска');
var запасной = document.getElementById('запасной');

function показать_доску(){
  рамка.src = АДРЕС;
  рамка.style.display = 'block';
  запасной.style.display = 'none';
}

function показать_запасной(причина){
  document.getElementById('сообщение').textContent = причина;
  document.getElementById('кнопка').style.display = '';
  document.getElementById('тихо').textContent =
    'адрес: localhost:34785 · всё на этом компьютере';
}

// Сначала СПРАШИВАЕМ, доступна ли доска, и только потом вставляем её в окно.
//
// Событию load у рамки верить нельзя: когда сервер не отвечает, браузер показывает
// внутри рамки свою страницу ошибки и честно сообщает «загрузилось». Ждать по
// таймеру — то же самое наоборот: медленная машина покажет запасной путь там, где
// доска открылась бы через три секунды. Поэтому пробуем достучаться запросом:
// он либо проходит, либо падает — и падает по обеим настоящим причинам сразу
// (движок не пустил локальный адрес внутрь защищённой страницы; сервер доски не
// поднят). Различить их со страницы нельзя, поэтому текст называет обе.
fetch(АДРЕС + 'favicon-32x32.png', {mode: 'no-cors', cache: 'no-store'})
  .then(показать_доску)
  .catch(function(){
    показать_запасной(
      'Доска не открылась внутри окна. Либо браузер не пускает локальный адрес ' +
      'внутрь защищённой страницы, либо доска на этом компьютере сейчас не запущена. ' +
      'Отдельным окном она откроется — и там будет видно, какая из двух причин.');
  });
</script>
</body>
</html>
