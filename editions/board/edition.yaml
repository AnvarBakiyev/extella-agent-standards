издание:
  имя: "Доска"
  контекст: "любая работа, где проще нарисовать, чем объяснить"
  тег: "board"
  версия: "0.3.0"

для_кого: >
  Тот, кому на встрече, в разборе или в проектировании быстрее набросать схему от руки,
  чем описать её словами. Отдельная программа для этого уже есть на машине — не хватало
  только входа в неё из ОС.

почему_бросит: >
  Доска, которая живёт «где-то на порту», не открывается тогда, когда нужна: адрес забыт,
  сервер после перезагрузки не поднялся. Здесь у неё есть окно в ОС, а сервер поднимается
  сам при входе в систему.

состав:
  приложения:
    - имя: "Доска"
      тип: страница

данные:
  где_живут: устройство
  чувствительные: false

не_ходит_к_платформе: да
права_приложения: []

готовность:
  - доска открывается из ОС одним движением
  - рисунки остаются на этом компьютере и никуда не уходят
  - сервер доски поднимается сам после перезагрузки
  - если движок не пускает локальный адрес внутрь окна, страница честно говорит об этом
    и открывает доску отдельным окном
