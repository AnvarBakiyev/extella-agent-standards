издание:
  имя: "Схемы"
  контекст: "процессы, структуры и связи, которые надо показать, а не пересказать"
  тег: "diagrams"
  версия: "0.1.0"

для_кого: >
  Тот, кто описывает процесс, оргструктуру или связь систем и упирается в то, что словами
  это занимает страницу, а картинкой — минуту. Схемы нужны ему регулярно, а не однажды.

почему_бросит: >
  Привычные редакторы схем требуют аккаунт и держат чертежи на чужом сервере — а схема
  часто и есть устройство компании. Здесь редактор целиком на своей машине, работает без
  интернета, и ни один чертёж никуда не отправляется.

состав:
  приложения:
    - имя: "Схемы"
      тип: страница

не_ходит_к_платформе: да
данные:
  где_живут: устройство
  чувствительные: false
права_приложения: []

готовность:
  - редактор открывается из ОС в своём окне
  - работает без интернета целиком
  - ни один запрос не уходит за пределы этого компьютера
  - чертежи сохраняются файлами на диск, а не в чужое облако
