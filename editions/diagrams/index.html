<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Схемы</title>
<style>
:root{--a:#D4944A;--petrol:#5FA8A0;--bg:#0A0A0A;--tx:#F5F3EE;--tx2:#C9C3B8;--tx3:#8C8C8C}
:root[data-lm="1"]{--a:#C57E33;--petrol:#2F6B66;--bg:#FAF9F5;--tx:#0A0A0A;--tx2:#2A2A2A;--tx3:#8C8C8C}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,sans-serif}
#окно{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.запасной{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.карточка{max-width:520px}
h1{font:600 24px/1.2 Georgia,serif;margin:0 0 8px}
p{color:var(--tx2);margin:0 0 14px}
.btn{display:inline-block;font:600 15px system-ui;color:#0A0A0A;background:var(--a);
  border:0;border-radius:5px;padding:12px 20px;cursor:pointer;text-decoration:none}
.тихо{font:11px ui-monospace,Menlo,monospace;color:var(--tx3);margin-top:16px}
</style>
</head>
<body>
<iframe id="окно" allow="clipboard-read; clipboard-write"></iframe>

<div class="запасной" id="запасной">
  <div class="карточка">
    <h1>Схемы</h1>
    <p id="сообщение">Открываю…</p>
    <a class="btn" id="кнопка" href="http://localhost:34786/?offline=1&lang=ru" target="_blank" rel="noopener"
       style="display:none">Открыть в отдельном окне</a>
    <div class="тихо" id="тихо"></div>
  </div>
</div>

<script>
// ОБЩИЙ КАРКАС ОКНА ДЛЯ МЕСТНОГО ПРИЛОЖЕНИЯ. Собирается из этого шаблона
// инструментом tools/make_local_app_page.py — руками не правится, иначе три
// одинаковые страницы разъедутся по мелочам, как уже бывало.
//
// ЗАЧЕМ ЗАПАСНОЙ ПУТЬ. Оболочка ОС открывает приложение в iframe внутри своей
// https-страницы (прочитано в desktop.js), а приложение живёт на http://localhost:
// Chromium такой адрес считает доверенным и пускает, Safari блокирует смешанное
// содержимое. Страница не гадает: сначала спрашивает приложение запросом, потом
// вставляет в окно, а если не достучалась — открывает отдельным окном (переход
// верхнего уровня на http не блокирует никто).
//
// Событию load у рамки верить нельзя: при мёртвом сервере браузер показывает
// внутри свою страницу ошибки и рапортует «загрузилось».
function тема(t){
  if (t === 'light') document.documentElement.setAttribute('data-lm','1');
  else document.documentElement.removeAttribute('data-lm');
}
window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type === 'etb_theme' || d.type === 'etb_init') тема(d.theme);
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) тема('light');

var АДРЕС = 'http://localhost:34786/?offline=1&lang=ru';
var ПРОБА = 'http://localhost:34786/images/spin.gif';
var окно_ = document.getElementById('окно');
var запасной = document.getElementById('запасной');

fetch(ПРОБА, {mode: 'no-cors', cache: 'no-store'})
  .then(function(){
    окно_.src = АДРЕС;
    окно_.style.display = 'block';
    запасной.style.display = 'none';
  })
  .catch(function(){
    // Формулировка намеренно безличная: имя приложения подставляется в заголовок,
    // а в текст — нет. Иначе шаблон выдаёт «Доска не открылось»: род не угадать.
    document.getElementById('сообщение').textContent =
      'Не открылось внутри окна. Либо браузер не пускает локальный адрес внутрь ' +
      'защищённой страницы, либо приложение на этом компьютере сейчас не запущено. ' +
      'Отдельным окном оно откроется — и там будет видно, какая из двух причин.';
    document.getElementById('кнопка').style.display = '';
    document.getElementById('тихо').textContent = 'адрес: localhost:34786 · всё на этом компьютере';
  });
</script>
</body>
</html>
