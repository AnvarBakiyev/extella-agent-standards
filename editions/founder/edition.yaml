издание:
  имя: "Издание для основателя"
  контекст: "основатель, который держит всё в голове"
  тег: "edition-founder"
  версия: "0.1.0"

для_кого: >
  Тот, кто одновременно ведёт продукт, людей и переговоры, решает по десять вопросов в день
  и не помнит, что решил вчера. Решения живут в чатах, чаты теряются, факты протухают за сутки.

почему_бросит: >
  Заметки и таск-трекеры хранят задачи, но не решения и не их срок годности. Здесь решение
  живёт с датой и с пометкой, когда его надо перепроверить, и всё это лежит на его машине.

состав:
  тема: theme.js
  приложения:
    - имя: "Решения"
      тип: гибрид
  агенты:
    - роль: "Секретарь решений"

данные:
  где_живут: устройство
  чувствительные: true

права_приложения:
  - expert.run
  - device.run

готовность:
  - решение записывается голосом или строкой и сразу видно в списке
  - видно, какие решения пора перепроверить
  - поиск по решениям работает без сети
  - ни одно решение не уходит с машины
