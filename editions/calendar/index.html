<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Календарь</title>
<style>
:root{--a:#D4944A;--petrol:#5FA8A0;--bg:#0A0A0A;--tx:#F5F3EE;--tx2:#C9C3B8;--tx3:#8C8C8C;
  --гр:rgba(243,238,229,.09)}
:root[data-lm="1"]{--a:#C57E33;--petrol:#2F6B66;--bg:#FAF9F5;--tx:#0A0A0A;--tx2:#2A2A2A;
  --tx3:#8C8C8C;--гр:#D7E0DC}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);
  font:400 13px/1.5 Nunito,system-ui,-apple-system,sans-serif;
  display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit}
/* Строка агента — общая шапка каждого окна. Команда живёт там, где взгляд:
   «возьми из астры первые 8» кладёт данные СЮДА, в это приложение, — окно и есть
   контекст. Отдельный пульт-посредник снят решением Анвара 20.08.2026. */
.строка{display:flex;gap:8px;align-items:center;padding:8px 12px;
  background:var(--bg);border-bottom:1px solid var(--гр)}
.строка input{flex:1;min-width:0;font-size:13px;color:var(--tx);
  background:transparent;border:1px solid var(--гр);border-radius:8px;
  padding:8px 12px}
.строка input::placeholder{color:var(--tx3)}
.строка input:focus{outline:none;border-color:var(--a)}
.сказать{font-size:13px;font-weight:600;color:#fff;background:var(--a);
  border:0;border-radius:999px;padding:8px 16px;cursor:pointer}
.сказать[disabled]{opacity:.6;cursor:default}
.ответ{display:none;gap:12px;align-items:flex-start;padding:8px 12px;
  background:var(--bg);border-bottom:1px solid var(--гр);
  color:var(--tx2);font-size:13px}
.ответ span{flex:1;white-space:pre-wrap;word-break:break-word}
.ответ button{background:none;border:0;color:inherit;opacity:.5;cursor:pointer;
  font-size:15px;line-height:1;padding:0 2px}
#окно{flex:1;width:100%;border:0;display:none;background:#fff}
.запасной{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;background:var(--bg)}
.карточка{max-width:540px}
h1{font:600 26px/1.2 'Source Serif 4',Georgia,serif;margin:0 0 10px}
p{color:var(--tx2);margin:0 0 16px}
.btn{display:inline-block;font-size:15px;font-weight:600;color:#fff;background:var(--a);
  border:0;border-radius:999px;padding:12px 24px;cursor:pointer;text-decoration:none}
.тихо{font:11px 'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--tx3);
  margin-top:16px;line-height:1.7}
/* Узкая полоска снизу: выход на случай «окно пустое», который НЕ закрывает
   само приложение. Раньше на её месте была карточка во весь экран, и она
   прятала работающую доску. */
.полоска{position:absolute;left:0;right:0;bottom:0;display:none;gap:12px;
  align-items:center;justify-content:center;padding:8px 12px;
  background:rgba(10,10,10,.86);color:#F5F3EE;font-size:13px}
:root[data-lm="1"] .полоска{background:rgba(250,249,245,.94);color:#0A0A0A;
  box-shadow:0 -1px 0 rgba(0,0,0,.09)}
.полоска button{background:none;border:0;color:inherit;opacity:.5;cursor:pointer;
  font-size:15px;line-height:1;padding:0 2px}
</style>
</head>
<body>
<div class="строка" id="строка">
  <input id="фраза" type="text" autocomplete="off" spellcheck="false"
         placeholder="Скажите агенту: возьми из астры первые 8 — положит сюда">
  <button type="button" class="сказать" id="сказать">Сказать</button>
</div>
<div class="ответ" id="ответ">
  <span id="ответ_текст"></span>
  <button type="button" id="ответ_закрыть" title="Скрыть">×</button>
</div>

<iframe id="окно" allow="clipboard-read; clipboard-write"></iframe>

<div class="запасной" id="запасной">
  <div class="карточка">
    <h1>Календарь</h1>
    <p id="сообщение">Открываю…</p>
    <div class="тихо" id="тихо"></div>
  </div>
</div>

<div class="полоска" id="полоска">
  <span id="полоска_текст"></span>
  <button type="button" class="сказать" id="полоска_обновить"
          style="display:none;padding:4px 12px">Обновить</button>
  <button type="button" id="полоска_закрыть" title="Скрыть">×</button>
</div>

<script>
// ОБЩИЙ КАРКАС ОКНА ДЛЯ МЕСТНОГО ПРИЛОЖЕНИЯ. Собирается из этого шаблона
// инструментом tools/make_local_app_page.py — руками не правится, иначе три
// одинаковые страницы разъедутся по мелочам, как уже бывало.
//
// ДВЕ ПРОВЕРКИ, А НЕ ОДНА. Оболочка ОС открывает продукт в iframe внутри своей
// https-страницы (прочитано в desktop.js). Приложение при этом оказывается «третьей
// стороной», и мало того что до него надо достучаться — ему ещё должно быть где
// хранить работу.
//
//   1. ЖИВО ЛИ. Запрос к маленькому файлу приложения. Событию load у рамки верить
//      нельзя: при мёртвом сервере браузер показывает внутри свою страницу ошибки
//      и рапортует «загрузилось».
//   2. ЕСТЬ ЛИ ХРАНИЛИЩЕ. Отвечает САМА страница приложения: установщик вставил
//      в неё маленькую пробу (tools/inject_probe.py), и она сообщает вердикт сюда.
//      Отдельный файл-разведчик не годится: excalidraw ставит service worker на
//      весь порт, и любой адрес там отдаёт саму доску — разведчик не доезжает.
//
// Замер 15.08.2026: без хранилища drawio показывает английское «Error loading page»,
// а excalidraw открывается и молча теряет рисунки при закрытии окна. Поэтому в таком
// окне мы приложение НЕ вставляем: лучше честная карточка со словами «скажите чату»,
// чем красивая рамка, которая съедает работу. Отдельное окно — НЕ выход: оно
// наследует ту же песочницу (замер 20.08.2026, Сторож), чинится только основное.
function тема(t){
  if (t === 'light') document.documentElement.setAttribute('data-lm','1');
  else document.documentElement.removeAttribute('data-lm');
}
window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type === 'etb_theme' || d.type === 'etb_init') тема(d.theme);
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) тема('light');

var АДРЕС = 'http://localhost:34789/_extella_page/calendar.html';
var ПРОБА = 'http://localhost:34789/_extella_page/calendar.html';
var РАЗВЕДЧИК = '';
var окно_ = document.getElementById('окно');
var запасной = document.getElementById('запасной');
var полоска_ = document.getElementById('полоска');
var вердикт = false;      // пришёл ли ответ от самой страницы приложения

// ПРИЛОЖЕНИЕ ПОКАЗЫВАЕМ СРАЗУ, до всяких проверок. Так было не всегда: раньше
// впереди стоял экран-сторож, и приложение вставлялось, только если проверка
// доступности прошла. Замер 16.08.2026 на живой Доске схем: проверка — это
// запрос из интернета к вам на компьютер, а браузер такие режет, и она молчала
// при полностью исправном приложении. Сторож вставал стеной перед работающей
// доской и выталкивал человека в отдельное окно — ровно то, ради отказа от чего
// всё и делалось. Вопрос Анвара «а зачем нам первый экран вообще» — по делу.
окно_.src = АДРЕС;
окно_.style.display = 'block';
запасной.style.display = 'none';

// Загрузилась ли рамка вообще. Событию load нельзя верить как «приложение живо»
// (при мёртвом сервере браузер покажет внутри свою страницу ошибки и отрапортует
// «загрузилось»), но ОБРАТНОЕ верно: если load не случился вовсе, значит адрес
// внутрь страницы не пустили. Это разные беды, и человеку надо разное сказать.
var загрузилась = false;
окно_.addEventListener('load', function(){ загрузилась = true; });

// ПУСТИЛИ ЛИ АДРЕС ВНУТРЬ. Когда браузер не пропускает адрес в рамку, он
// оставляет там свою пустую страницу — и событие load всё равно случается,
// поэтому по нему одному не отличить «загрузилось» от «не пустили». Но пустая
// страница браузера принадлежит НАМ: в неё можно заглянуть. Чужое содержимое
// заглянуть не даёт — и это как раз означает, что приложение внутри живёт.
function не_пустили(){
  try {
    var д = окно_.contentDocument;
    if (!д) return false;                       // чужое содержимое: пустили
    return !д.body || д.body.childElementCount === 0;
  } catch (e) {
    return false;                               // доступ закрыт: значит пустили
  }
}

function полоской(текст){
  // Подсказка снизу: даёт выход, но НЕ прячет приложение. Молчание проверки —
  // не доказательство поломки, а всего лишь отсутствие ответа.
  document.getElementById('полоска_текст').textContent = текст;
  полоска_.style.display = 'flex';
}
document.getElementById('полоска_закрыть').onclick = function(){
  полоска_.style.display = 'none';
};

function карточкой(текст, подпись){
  // Перекрыть приложение разрешено ТОЛЬКО настоящей бедой: приложение прямо
  // сказало «хранить работу негде» либо его вовсе нет на этом компьютере.
  // Во всех остальных случаях — полоска снизу, а окно остаётся человеку.
  полоска_.style.display = 'none';
  окно_.style.display = 'none';
  запасной.style.display = 'flex';
  document.getElementById('сообщение').textContent = текст;
  document.getElementById('тихо').textContent = подпись;
}

// Приложение упало уже ПОСЛЕ того, как доложило о себе: подмена хранилища встаёт
// в самом начале страницы, а сам код приложения выполняется после неё. Раньше
// окно этот доклад не слушало — приложение честно кричало об ошибке, а человек
// видел белизну и ни слова. Замер 16.08.2026 на Доске схем.
// Приложение просит перечитать себя: работу поменял кто-то другой (агент,
// вторая копия окна), а перезагрузить себя из песочницы оно не может —
// location.reload там запертая дверь того же класса, что History API.
// Перенавигация СВОЕЙ рамки обёртке разрешена. Замер 20.08.2026: «новая
// доска» чистила хранилище, а открытое окно оставалось со старой сценой.
function перечитать_окно(){
  окно_.src = 'about:blank';
  setTimeout(function(){ окно_.src = АДРЕС; }, 50);
}
window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type === 'extella_перечитать') перечитать_окно();
});

// Обновление — КНОПКОЙ, не насилием. Слово Анвара 21.08.2026: перезагрузка
// посреди набора съедала ввод и сбрасывала ячейку. Пока человек работает,
// чужая правка ждёт его решения; обновляется само только при долгом простое
// (это решает шим внутри приложения).
var кнопка_обновить = document.getElementById('полоска_обновить');
кнопка_обновить.onclick = function(){
  кнопка_обновить.style.display = 'none';
  полоска_.style.display = 'none';
  перечитать_окно();
};
window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type !== 'extella_обновление_ждёт') return;
  кнопка_обновить.style.display = '';
  полоской('Появились изменения — например, от агента. Обновить сейчас или доработайте и нажмите позже.');
});

window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type !== 'extella_сбой') return;
  // «Откройте отдельным окном» здесь не советуем: отдельное окно Электрона
  // наследует ту же песочницу, совет был легендой. Замер 20.08.2026, Сторож.
  полоской('Приложение не смогло запуститься: ' + (d.причина || 'ошибка') +
           '. Обновите окно; если не поможет — скажите чату.');
});

window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type !== 'extella_проба') return;
  вердикт = true;
  if (d.ок) {
    // Приложение работает. Если часть возможностей закрыта песочницей окна —
    // это не поломка, но умолчать нельзя: человек должен знать заранее, что
    // переживёт закрытие окна, а что нет. Спокойной строкой, не обвинением.
    if (d.причина) полоской(d.причина);
    return;
  }
  // Формулировка безличная намеренно: имя подставляется в заголовок, а в текст —
  // нет, иначе шаблон выдаёт «Доска не открылось»: род не угадать.
  карточкой('Здесь приложению негде хранить работу: браузер закрывает хранилище ' +
            'всему, что открыто внутри чужой страницы. Это чинится на нашей ' +
            'стороне — скажите чату.',
            'адрес: localhost:34789 · сетка месяца поверх «Задач и календаря», всё на этом компьютере · причина: ' + (d.причина || 'хранилище закрыто'));
});

// Проверка идёт ФОНОМ и только чтобы объяснить пустое окно, если оно пустое.
// Приложение к этому моменту уже показано и работает, если может.
setTimeout(function(){
  if (вердикт) return;                     // приложение отчиталось само — молчим
  fetch(ПРОБА, {mode: 'no-cors', cache: 'no-store'})
    .then(function(){
      // Приложение отвечает, но о себе не доложило. Причины разные, и молчать
      // о них нельзя — иначе человек смотрит в белое и не знает, что делать.
      if (!загрузилась || не_пустили()) {
        // Приложение отвечает, а внутрь его не пустили. Так бывает, когда окно
        // защищённое, а адрес приложения — обычный: браузер их не смешивает.
        полоской('Браузер не пустил приложение внутрь этого окна. ' +
                 'Это чинится на нашей стороне — скажите чату.');
      } else {
        полоской('Приложение внутри не отвечает. Обновите окно ещё раз; ' +
                 'если снова пусто — скажите чату.');
      }
    })
    .catch(function(){
      // Не отвечает вовсе: в рамке будет страница ошибки браузера, и честнее
      // сказать прямо, чем оставить человека смотреть в белое.
      карточкой('Приложение на этом компьютере сейчас не запущено: его служба ' +
                'остановлена. Перезапустите Extella или скажите чату.',
                'адрес: localhost:34789 · сетка месяца поверх «Задач и календаря», всё на этом компьютере · не отвечает');
    });
}, 6000);

// ── СТРОКА АГЕНТА ─────────────────────────────────────────────────────────
// Одна и та же строка в шапке КАЖДОГО окна — команда живёт там, где взгляд.
// Фраза уезжает местному серверу этого же приложения (действие «скажи»), и
// вместе с ней едет имя окна: «возьми из астры первые 8» без названного
// получателя кладёт данные СЮДА. Пульт-посредник этим и заменён (20.08.2026).
var ОКНО_ИМЯ = 'Календарь';
var ДЕЙСТВИЕ = new URL('/_extella_action', АДРЕС).href;
var фраза_ = document.getElementById('фраза');
var сказать_ = document.getElementById('сказать');
var ответ_ = document.getElementById('ответ');
var ответ_текст_ = document.getElementById('ответ_текст');

function ответом(текст){
  ответ_текст_.textContent = текст;
  ответ_.style.display = 'flex';
}
document.getElementById('ответ_закрыть').onclick = function(){
  ответ_.style.display = 'none';
};

// Ожидание видно с первого кадра, повтор заблокирован, кнопка возвращается
// в finally — иначе первая же ошибка оставила бы её выключенной навсегда.
function сказать(){
  var т = (фраза_.value || '').trim();
  if (!т) { фраза_.focus(); return; }
  сказать_.disabled = true;
  var было = сказать_.textContent;
  сказать_.textContent = 'Делаю…';
  ответом('Агент делает. Первая встреча с новым форматом занимает до минуты.');
  fetch(ДЕЙСТВИЕ, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({действие: 'скажи', фраза: т, окно: ОКНО_ИМЯ})
  }).then(function(о){ return о.json(); })
    .then(function(д){
      var текст = д.вывод || д.ошибка || 'пустой ответ — скажите чату';
      // Метка от диспетчера: результат лёг в ЭТО окно — перечитать рамку,
      // чтобы человек увидел его сразу, а память окна не воскресила старое.
      if (текст.indexOf('[окно-обновится]') >= 0) {
        текст = текст.replace('[окно-обновится]', '').trim();
        перечитать_окно();
      }
      ответом(текст);
      if (д.код === 0) фраза_.value = '';
    })
    .catch(function(){
      ответом('Не достучался до агента на этом компьютере. Обновите окно; ' +
              'если не поможет — скажите чату.');
    })
    .finally(function(){
      сказать_.disabled = false;
      сказать_.textContent = было;
    });
}
сказать_.onclick = сказать;
фраза_.addEventListener('keydown', function(e){
  if (e.key === 'Enter') сказать();
});
</script>
</body>
</html>
