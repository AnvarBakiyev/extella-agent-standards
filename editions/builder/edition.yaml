издание:
  имя: "Издание для сборщика"
  контекст: "тот, кто собирает ИИ-приложения для своей компании"
  тег: "edition-builder"
  версия: "0.1.0"

для_кого: >
  Человек, которому поручили «сделать нам ИИ», и он начинает с пустого места: где канон,
  чем проверять, как выложить, чтобы это увидели другие. Не разработчик платформы, а тот,
  кто собирает под свою компанию из готового.

почему_бросит: >
  Не потому что сложно, а потому что состав рабочего места собирается по крупицам неделю:
  ссылки в чатах, репозиторий по памяти, гейты «где-то были». Здесь состав виден целиком
  до покупки и ставится сам, одной кнопкой, за минуту.

состав:
  приложения:
    - имя: "Витрина издания"
      тип: страница
    - имя: "Разработка на Extella"
      тип: гибрид
  репозитории:
    - имя: "Стандарты и гейты локально"

данные:
  где_живут: устройство
  чувствительные: false

права_приложения:
  - expert.run
  - device.run

готовность:
  - витрина показывает весь состав до покупки, без сюрприза постфактум
  - видно, что уже стоит на этой машине, а чего нет
  - недостающее ставится одной кнопкой и подтверждением поимённо
  - уже стоящее не трогается и не покупается повторно
  - без подтверждения не меняется ничего
