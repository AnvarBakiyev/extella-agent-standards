# Состав издания «Тихий кабинет» — что именно поставится человеку одной покупкой.
#
# Принцип отбора: инструмент попадает сюда, только если работает БЕЗ интернета,
# БЕЗ аккаунта и БЕЗ чужого сервера. Проверено замером сетевых запросов: при работе
# все три обращаются только к localhost и к встроенным картинкам (14.08.2026).

издание:
  имя: "Тихий кабинет"
  английское_имя: "Quiet Desk"
  роль: "тот, кто работает с документами, которые нельзя отдавать наружу"
  версия: "0.1.0"

что_поставится_словами: >
  Доска для набросков от руки, редактор схем и процессов, просмотрщик PDF. Каждый
  открывается из ОС в своём окне, поднимается сам при входе в систему и не отправляет
  наружу ни одного запроса. Всё лежит в одной папке — снять так же просто, как поставить.

приложения:
  - имя: "Доска"
    listing_id: "e8c87ee0-8faa-47ca-8d50-7624c8c2d26b"
    зачем: "набросать схему от руки, пока говоришь"
    обязательно: да
  - имя: "Схемы"
    listing_id: "87988093-d819-4cd1-83a8-ad614fa12392"
    зачем: "процессы и оргструктуры картинкой, а не страницей текста"
    обязательно: да
  - имя: "Читалка"
    listing_id: "9136f984-8a6d-4e47-a494-e75dfbefe65b"
    зачем: "читать договоры, не загружая их на чужой сервер"
    обязательно: да

агенты: []
скиллы: []
mcp: []
cli: []
модели: []

# Программы кабинета. Ставятся с официальных страниц выпусков, ВЕРСИЯ ПРИБИТА:
# «последняя» однажды приедет другой и сломает то, что вчера работало.
репозитории:
  - откуда: "jgraph/drawio"
    тег: "v31.1.8"
    куда: "~/extella-cabinet/diagrams"
    зачем: "редактор схем целиком на своей машине"
  - откуда: "mozilla/pdf.js"
    тег: "v6.2.108"
    куда: "~/extella-cabinet/reader"
    зачем: "просмотр PDF без загрузки документа куда-либо"

# ЧЕСТНАЯ ДЫРА, которую видно и в установщике, и здесь: у доски нет готового выпуска —
# только исходники, которые надо собирать (нужен node). На машине владельца она уже
# собрана и работает; для чужой машины этот шаг издание пока НЕ делает и говорит об этом
# прямо, а не показывает зелёную галочку. Закрывается либо доставкой собранной доски
# в архиве издания, либо шагом сборки в установщике.

обещания:
  время_установки_минут: 3        # замер: pdf.js 5,5 с · drawio 83 с на быстрой сети
  данные_наружу: нет              # проверено списком сетевых запросов, а не обещанием
  снимается_полностью: да         # одна папка ~/extella-cabinet + три службы
