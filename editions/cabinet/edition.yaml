издание:
  имя: "Тихий кабинет"
  контекст: "работа с документами и схемами, которую нельзя отдавать наружу"
  тег: "edition-cabinet"
  версия: "0.1.0"

для_кого: >
  Тот, кто каждый день рисует, чертит и читает документы — и у кого среди этих документов
  есть чужие: договоры клиентов, выписки, внутренние схемы. Ему не нужен ещё один сервис
  с подпиской, ему нужны рабочие инструменты, которые ничего никуда не отправляют.

почему_бросит: >
  Привычные онлайн-инструменты требуют аккаунт и держат работу на чужом сервере. Для
  договора клиента это недопустимо, а собирать локальные аналоги по одному — неделя возни:
  найти, поставить, поднять, не забыть после перезагрузки. Здесь всё это ставится разом
  и поднимается само.

состав:
  приложения:
    - имя: "Витрина кабинета"
      тип: страница
    - имя: "Доска"
      тип: страница
    - имя: "Схемы"
      тип: страница
    - имя: "Читалка"
      тип: страница

данные:
  где_живут: устройство
  чувствительные: false

права_приложения:
  - expert.run
  - device.run

готовность:
  - витрина показывает весь состав и что из него уже стоит
  - недостающее ставится одной кнопкой с подтверждением поимённо
  - каждое приложение поднимается само при входе в систему
  - ни один инструмент не делает запросов за пределы этого компьютера
  - все три слушают только этот компьютер, а не сеть вокруг
