<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Читалка</title>
<style>
:root{--a:#D4944A;--petrol:#5FA8A0;--bg:#0A0A0A;--tx:#F5F3EE;--tx2:#C9C3B8;--tx3:#8C8C8C}
:root[data-lm="1"]{--a:#C57E33;--petrol:#2F6B66;--bg:#FAF9F5;--tx:#0A0A0A;--tx2:#2A2A2A;--tx3:#8C8C8C}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 system-ui,-apple-system,sans-serif}
#окно{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
.запасной{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.карточка{max-width:540px}
h1{font:600 26px/1.2 Georgia,serif;margin:0 0 10px}
p{color:var(--tx2);margin:0 0 16px}
.btn{display:inline-block;font:600 15px system-ui;color:#0A0A0A;background:var(--a);
  border:0;border-radius:6px;padding:13px 22px;cursor:pointer;text-decoration:none}
.тихо{font:11px ui-monospace,Menlo,monospace;color:var(--tx3);margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<iframe id="окно" allow="clipboard-read; clipboard-write"></iframe>

<div class="запасной" id="запасной">
  <div class="карточка">
    <h1>Читалка</h1>
    <p id="сообщение">Открываю…</p>
    <a class="btn" id="кнопка" href="http://localhost:34787/" target="_blank" rel="noopener"
       style="display:none">Открыть в отдельном окне</a>
    <div class="тихо" id="тихо"></div>
  </div>
</div>

<script>
// ОБЩИЙ КАРКАС ОКНА ДЛЯ МЕСТНОГО ПРИЛОЖЕНИЯ. Собирается из этого шаблона
// инструментом tools/make_local_app_page.py — руками не правится, иначе три
// одинаковые страницы разъедутся по мелочам, как уже бывало.
//
// ДВЕ ПРОВЕРКИ, А НЕ ОДНА. Оболочка ОС открывает продукт в iframe внутри своей
// https-страницы (прочитано в desktop.js). Приложение при этом оказывается «третьей
// стороной», и мало того что до него надо достучаться — ему ещё должно быть где
// хранить работу.
//
//   1. ЖИВО ЛИ. Запрос к маленькому файлу приложения. Событию load у рамки верить
//      нельзя: при мёртвом сервере браузер показывает внутри свою страницу ошибки
//      и рапортует «загрузилось».
//   2. ЕСТЬ ЛИ ХРАНИЛИЩЕ. Отвечает САМА страница приложения: установщик вставил
//      в неё маленькую пробу (tools/inject_probe.py), и она сообщает вердикт сюда.
//      Отдельный файл-разведчик не годится: excalidraw ставит service worker на
//      весь порт, и любой адрес там отдаёт саму доску — разведчик не доезжает.
//
// Замер 15.08.2026: без хранилища drawio показывает английское «Error loading page»,
// а excalidraw открывается и молча теряет рисунки при закрытии окна. Поэтому в таком
// окне мы приложение НЕ вставляем: лучше честная карточка и отдельное окно, где всё
// работает, чем красивая рамка, которая съедает работу.
function тема(t){
  if (t === 'light') document.documentElement.setAttribute('data-lm','1');
  else document.documentElement.removeAttribute('data-lm');
}
window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type === 'etb_theme' || d.type === 'etb_init') тема(d.theme);
});
if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) тема('light');

var АДРЕС = 'http://localhost:34787/';
var ПРОБА = 'http://localhost:34787/web/images/loading-icon.gif';
var РАЗВЕДЧИК = '';
var окно_ = document.getElementById('окно');
var запасной = document.getElementById('запасной');
var решено = false;
var вердикт = false;      // пришёл ли ответ от самой страницы приложения

function встроить(){
  if (решено) return;
  решено = true;
  окно_.src = АДРЕС;
  окно_.style.display = 'block';
  запасной.style.display = 'none';
}

function карточкой(текст, подпись){
  // Карточке разрешено перебить уже вставленное приложение: вердикт «хранилища
  // нет» приходит ПОСЛЕ вставки, и оставить рабочее с виду окно нельзя — человек
  // будет в нём работать, а работа не сохранится.
  решено = true;
  окно_.style.display = 'none';
  запасной.style.display = 'flex';
  document.getElementById('сообщение').textContent = текст;
  document.getElementById('кнопка').style.display = '';
  document.getElementById('тихо').textContent = подпись;
}

window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.type !== 'extella_проба') return;
  вердикт = true;
  if (d.ок) return;                    // приложение уже открыто, всё в порядке
  // Формулировка безличная намеренно: имя подставляется в заголовок, а в текст —
  // нет, иначе шаблон выдаёт «Доска не открылось»: род не угадать.
  карточкой('Здесь приложению негде хранить работу: браузер закрывает хранилище ' +
            'всему, что открыто внутри чужой страницы. Отдельным окном всё ' +
            'работает, включая сохранение.',
            'адрес: localhost:34787 · документы не покидают компьютер · причина: ' + (d.причина || 'хранилище закрыто'));
});

fetch(ПРОБА, {mode: 'no-cors', cache: 'no-store'})
  .then(function(){
    // Приложение живо: открываем его и ждём вердикт изнутри. Вставляем сразу,
    // чтобы не терять секунды на пустом экране; если хранилища нет, приложение
    // скажет об этом раньше, чем человек успеет что-то нарисовать.
    окно_.src = АДРЕС;
    окно_.style.display = 'block';
    запасной.style.display = 'none';
    // Проба молчит — значит её вставку кто-то снял или страница приложения
    // сменилась при обновлении. Молчание тут не «наверное, всё хорошо»:
    // так мы и проглядели, что drawio в окне мёртв.
    setTimeout(function(){
      if (!вердикт) {
        карточкой('Не удалось проверить, есть ли у приложения место для работы. ' +
                  'Отдельным окном оно откроется наверняка.',
                  'адрес: localhost:34787 · документы не покидают компьютер · проба молчит');
      }
    }, 6000);
  })
  .catch(function(){
    карточкой('Приложение на этом компьютере сейчас не запущено. Откройте его ' +
              'отдельным окном: если и там пусто, служба остановлена.',
              'адрес: localhost:34787 · документы не покидают компьютер · не отвечает');
  });
</script>
</body>
</html>
