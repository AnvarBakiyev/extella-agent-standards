издание:
  имя: "Читалка"
  контекст: "документы, которые нельзя загружать в чужой сервис"
  тег: "reader"
  версия: "0.1.0"

для_кого: >
  Тот, кому каждый день приходят договоры, акты и выписки в PDF, и кто открывает их
  в первом попавшемся онлайн-просмотрщике, потому что так быстрее.

почему_бросит: >
  Онлайн-просмотрщик — это загрузка документа на чужой сервер. Для договора клиента или
  выписки это недопустимо, а альтернатива обычно тяжёлая. Здесь просмотрщик открывается
  как обычное окно и работает, не отправляя файл никуда.

состав:
  приложения:
    - имя: "Читалка"
      тип: страница

не_ходит_к_платформе: да
данные:
  где_живут: устройство
  чувствительные: false
права_приложения: []

готовность:
  - PDF открывается из ОС в своём окне
  - документ не загружается ни на какой сервер
  - поиск по тексту и печать работают
  - работает без интернета
