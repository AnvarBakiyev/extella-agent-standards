# Состав издания — что именно поставится человеку одной покупкой.
#
# Издание = готовое рабочее место под роль. Не оформление: облик ОС расширением
# не меняется (H19-секста). Ценность в СОСТАВЕ и в том, что он ставится сам.
#
# Этот файл читает установщик издания. Порядок разделов = порядок установки:
# сначала дешёвое и быстрое, тяжёлое — в конце и с отдельным согласием.

издание:
  имя: "Издание для сборщика"
  английское_имя: "Builder Edition"
  роль: "тот, кто собирает ИИ-приложения для своей компании"
  версия: "0.1.0"

# Человек читает это ДО покупки. Если список нельзя показать без стыда — состав плохой.
что_поставится_словами: >
  Гид по сборке, мост к твоему ассистенту, подключение к платформе, шаблон приложения
  и помощник по стандартам. После установки можно собрать и выложить своё приложение,
  ничего не настраивая руками.

# --- 1. Наши приложения из магазина ------------------------------------------
# Ставятся покупкой: установщик исполняется на машине покупателя, где лежит его
# токен, и вызывает purchase. Проверено 14.08.2026.
приложения:
  - имя: "Разработка на Extella"
    listing_id: "880d12e4-f082-486e-b92a-57e4eb09866d"
    зачем: "единый вход: канон, порядок стройки, путь до магазина"
    обязательно: да

# --- 2. Агенты ----------------------------------------------------------------
# Снимок агента приезжает вместе с листингом, отдел — профилем.
агенты:
  - роль: "помощник по стандартам"
    источник: приложение          # приезжает с приложением выше
    обязательно: нет

# --- 3. Скиллы ассистента ------------------------------------------------------
# Просто файлы в папке скиллов. Ставятся копированием, снимаются удалением.
скиллы:
  - имя: "extella-build"
    куда: "~/.claude/skills/"
    откуда: "включён в архив издания"
    зачем: "ассистент знает канон Extella и порядок сборки"

# --- 4. Подключения MCP --------------------------------------------------------
# ВНИМАНИЕ: правка чужого конфига. Правила ниже обязательны.
mcp:
  - имя: "extella"
    адрес: "https://api.extella.ai/mcp/"
    требует_токен: да            # спрашивается при первом запуске, в архив НЕ кладётся
    правило: >
      конфиг ассистента дополняется, а не перезаписывается; прежний файл сохраняется
      копией рядом; если запись с таким именем уже есть — не трогаем и говорим об этом

# --- 5. Инструменты командной строки -------------------------------------------
cli: []
  # - имя: "gh"
  #   проверка: "gh --version"
  #   если_нет: "сказать словами, как поставить; не ставить молча за человека"

# --- 6. Репозитории ------------------------------------------------------------
# Только по ТЕГУ и со сверкой суммы: из ветки приедет что угодно, что в неё запушили.
репозитории:
  - откуда: "AnvarBakiyev/extella-agent-standards"
    тег: "v0.1.0"                 # плавающая ветка запрещена (H14)
    куда: "~/extella/standards"
    зачем: "гейты и шаблоны локально, чтобы проверки шли без сети"

# --- 7. Модели -----------------------------------------------------------------
# Гигабайты. В архив не помещаются (лимит 100 МБ) и не ставятся молча.
модели: []
  # - имя: "…"
  #   размер_гб: 4
  #   спросить_отдельно: да      # только с явным согласием и видимым прогрессом

# --- Обещания издания человеку -------------------------------------------------
# Проверяются установщиком и попадают в отчёт установки.
обещания:
  время_установки_минут: 5        # больше — режем состав, а не терпим
  данные_наружу: нет              # ничего с машины не уходит
  снимается_полностью: да         # что поставили, то умеем снять
