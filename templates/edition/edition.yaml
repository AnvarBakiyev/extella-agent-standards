# Паспорт издания. Заполняется первым — от него зависит всё остальное.
# Издание = тема + набор приложений + отдел агентов + полка в магазине.

издание:
  имя: "Издание для дизайнеров"          # как увидит человек в магазине
  контекст: "дизайнер-фрилансер"          # ЖИЗНЕННЫЙ контекст, не «пол» и не «профессия вообще»
  тег: "edition-design"                   # по нему находится вся полка
  версия: "0.1.0"

# Ради кого. Одно предложение, без маркетинга. Если не пишется — издание не придумано.
для_кого: >
  Дизайнер, который ведёт 3-5 проектов одновременно и теряет время
  не в макетах, а в согласованиях, сроках и поиске «где та версия».

# Чем он пользуется сегодня и почему бросит это ради нас. Пусто = издание не нужно.
почему_бросит: >
  Сроки и правки живут в переписке, а не в одном месте. Мы держим их рядом
  с работой и не увозим ни одного макета с его машины.

состав:
  # тема: облик ОС расширением не меняется (H19-секста). Свой вид продукт
  # задаёт CSS внутри своего окна — отдельная тема для этого не нужна.
  приложения:                             # 1-3 своих, остальное — чужие из магазина
    - имя: "Проекты и сроки"
      тип: страница                       # страница | архив | гибрид
  агенты:                                 # отдел: несколько агентов одним листингом
    - роль: "Помощник по проектам"

данные:
  где_живут: устройство                   # устройство | облако
  чувствительные: false                   # здоровье, цикл, диагнозы, документы клиента
  # Если чувствительные: true — где_живут ОБЯЗАНО быть «устройство», иначе гейт падает.

права_приложения:                         # app_scopes: проси минимум, покупатель их видит
  - expert.run

готовность:                               # что считается сделанным
  - тема применяется и не трогает чужие окна
  - приложения открываются и делают одно дело целиком
  - отдел агентов отвечает
  - первый запуск чистым состоянием пройден
  - отчёт тремя частями: закрыл / не моё / не закрыл
