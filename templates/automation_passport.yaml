---
# Паспорт АВТОМАТИЗАЦИИ Extella (§2.3.1 + C-часть ТЗ «автоматизация как главный объект»).
# Заполняет владелец автоматизации. Проверка: python3 tools/check_automation_passport.py <файл>
# Отличие от agent_passport.yaml: автоматизация — то, что клиент купил и установил;
# платформенные агенты внутри неё — технические компоненты, а не самостоятельные объекты.

automation:
  automation_id: ""          # стабильный id, как в реестре; не имя и не путь; не меняется при переустановке
  registry_card_id: ""       # id карточки на устройстве, если он ОТЛИЧАЕТСЯ от automation_id.
                             # Без него Console не свяжет паспорт с установленной карточкой и
                             # покажет обе стороны как «мёртвую ссылку» (класс поймали на Баға).
  name:
    ru: ""
    en: ""
  owner: ""                  # человек, отвечающий за автоматизацию после запуска
  business_goal: ""          # какую боль закрывает, словами клиента
  version: ""                # версия автоматизации (не версия отдельного агента)
  languages: ["ru", "en"]    # §3.26 — обе обязательны
  hosting_profile: ""        # где живёт: local | server | client_server (A2).
                             # server/client_server — джанитор НЕ трогает: каталога на диске у них нет
  # ── Как Console узнаёт состояние. Нужен ХОТЯ БЫ ОДИН источник; предпочтителен первый.
  state_reader:              # состояние читает ЭКСПЕРТ на устройстве — без localhost
    expert: ""               # имя эксперта-диспетчера, который отдаёт состояние
    params: {}               # ТОЧНЫЙ объект вызова: у диспетчеров имена параметров разные
                             #   ps/rec/tgt: {method: "...", args_json: "[]", kwargs_json: "{}"}
                             #   law/trv:    {route: "/x/status", body_json: "{}"}
                             # Закрытый список ключей, только скаляры, секретов быть не может.
    method: "state"          # человекочитаемое имя метода (для интерфейса; вызов идёт по params)
    schema: ""               # схема ответа, напр. extella.automation_state.v1
    execution_device: ""     # стабильный id таргета, НА КОТОРОМ исполняется эксперт
    data_device: ""          # стабильный id таргета, ГДЕ лежат данные (может отличаться)
    evidence: "exact_target" # доказательство, что ответ пришёл с ТОГО устройства.
                             # Закрепление одиночным target платформа игнорирует молча,
                             # поэтому вызов идёт массивом targets и ответ несёт id устройства.
  service:                   # HTTP-контракт продукта со СВОИМ сервером (наследие)
    port: 0
    health: "/api/health"
    state: "/api/state"
  limits: []                 # чего автоматизация НЕ делает — обязательно, хотя бы одна строка
  help_surface: ""           # где на экране живёт пояснение «? Как это работает»

components:
  # Платформенные агенты — СКРЫТЫЕ технические компоненты автоматизации.
  platform_agents:
    - platform_agent_id: ""  # стабильный id вида agent_...; по имени связывать запрещено.
                             # Если агента выбирает пользователь на первом экране продукта
                             # (решение владельца 30.07.2026) — пиши USER_SELECTED и обязательно
                             # заполни binding_ref, иначе Console сочтёт ссылку мёртвой.
      binding_ref: ""        # где на устройстве лежит фактическая привязка (файл привязки)
      role: ""               # зачем этот агент в автоматизации
      provider_expected: "alibaba"   # канон: клиентские агенты только платформенный Qwen
  experts: []                # [{name, required}]
  schedules: []              # [{id, kind: external_cron|internal|in_service, cadence}]
  # Интеграции = ПРАВА автоматизации во внешних системах (A4). Права обязаны быть ВИДНЫ
  # в паспорте: корпоративный клиент проходит по нему ИБ-проверку, не читая наш код.
  # Секреты сюда НЕ пишутся никогда — только ссылка, ГДЕ секрет лежит.
  integrations: []
  #  - kind: "whatsapp"             # какая внешняя система
  #    account: "GreenAPI instance 1101…"   # чей доступ используется (без секрета)
  #    scopes: ["messages.read", "messages.send"]  # что именно разрешено — пусто нельзя
  #    external_writes: true        # пишет ли наружу
  #    human_in_loop: true          # подтверждает ли человек внешнюю запись; при записи объявить явно
  #    personal_data: "reads"       # none | reads | stores — обязательно, умолчания нет
  #    retention: "30 дней"         # обязательно при personal_data: stores
  #    secret_ref: "config.json:greenapi_token"  # ГДЕ лежит секрет, не сам секрет
  knowledge: []              # знания (Concepts), которыми пользуется автоматизация
  rules: []                  # правила

operations:
  rollback: ""               # как вернуть автоматизацию к предыдущему состоянию

# ---------------------------------------------------------------------------
# ДАЛЬШЕ — НЕОБЯЗАТЕЛЬНОЕ. Только под требование конкретного клиента (обычно корпоративная
# проверка безопасности). По умолчанию не заполняется: ни один из этих признаков сегодня не
# применяется в рантайме, а сочинённые значения делают паспорт хуже — он врёт правдоподобно.
# ---------------------------------------------------------------------------
optional:
  budgets:                   # объявляются, но рантайм их НЕ применяет
    max_duration_ms: 0
    max_llm_tokens: 0
    max_delegation_depth: 0
    max_external_actions: 0
  operations:
    observability: ""        # где видно работу автоматизации
    owner_on_call: ""        # кто дежурит
    rollout: ""              # как выкатывается
    success_metric: ""       # как понять, что работает хорошо
