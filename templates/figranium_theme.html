<script>
/* Робот браузера: светлая тема и без экрана выбора.

   Решение владельца 23.08.2026: «давай светлую тему брать просто и экран
   выбора не показывать». Четыре темы на старте — лишний вопрос человеку в
   первую секунду; светлая совпадает со столом Extella.

   Ставим ДО загрузки приложения, поэтому вставка идёт в шим (он вшивается
   в начало страницы). Не запрещаем смену: если человек сам выберет другую
   тему, его выбор уже лежит в хранилище и мы его не трогаем — переписываем
   только пустое место. */
(function () {
  try {
    if (!localStorage.getItem("figranium.theme")) {
      localStorage.setItem("figranium.theme", "light");
    }
    localStorage.setItem("figranium.seenThemeIntro", "true");
    document.cookie = "figranium_theme=light; path=/; max-age=31536000; SameSite=Lax";
  } catch (e) {}
})();
</script>
