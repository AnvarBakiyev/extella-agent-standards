<script>
/* Робот браузера: светлая тема, без экрана выбора и с видимым выходом.

   1) ТЕМА. Решение владельца 23.08.2026: «давай светлую тему брать просто и
   экран выбора не показывать». Четыре темы на старте — лишний вопрос человеку
   в первую секунду; светлая совпадает со столом Extella. Ставим ДО загрузки
   приложения, поэтому вставка идёт в шим. Не запрещаем смену: если человек сам
   выберет другую тему, его выбор уже лежит в хранилище и мы его не трогаем —
   переписываем только пустое место.

   2) ВЫХОД ИЗ ЖИВОГО БРАУЗЕРА. Замер 23.08.2026, слова владельца: «только как
   выйти обратно из этого режима, непонятно». Кнопки выхода и осмотра живут в
   шапке карточки сессии, а шапка эта — обычный блок: стоит содержимому
   прокрутиться, и она уходит за верхний край. Человек видит экран браузера во
   весь рост и ни одного способа его закрыть. Прибиваем шапку к верху.

   Ищем по ТЕКСТУ, а не по классам: у приложения классы вида `bg-black/20`
   генерируются сборкой и меняются при каждом её обновлении — привязка к ним
   отвалится тихо, и узнаем мы об этом от человека, а не от кода. */
(function () {
  try {
    if (!localStorage.getItem("figranium.theme")) {
      localStorage.setItem("figranium.theme", "light");
    }
    localStorage.setItem("figranium.seenThemeIntro", "true");
    document.cookie = "figranium_theme=light; path=/; max-age=31536000; SameSite=Lax";
  } catch (e) {}

  var МЕТКА = "active browser session";
  var прибито = null;

  function отметиться(что) {
    try { new Image().src = "/__shim?stage=session-bar&what=" + encodeURIComponent(что); }
    catch (e) {}
  }

  function прибить() {
    if (прибито && document.contains(прибито)) return;
    var узлы = document.querySelectorAll("span, div");
    for (var i = 0; i < узлы.length; i++) {
      var э = узлы[i];
      if (э.children.length) continue;                    // только сам текст
      if ((э.textContent || "").trim().toLowerCase() !== МЕТКА) continue;
      // Поднимаемся до шапки — предка, внутри которого лежат и подпись, и
      // кнопки. Подъём ограничен: без предела прилипла бы половина страницы.
      var шапка = э;
      for (var ш = 0; ш < 5 && шапка.parentElement; ш++) {
        шапка = шапка.parentElement;
        if (шапка.querySelector("button")) break;
      }
      if (!шапка.querySelector("button")) return;
      шапка.style.position = "sticky";
      шапка.style.top = "0";
      шапка.style.zIndex = "40";
      // Своей подложки не ставим: у шапки уже есть фон, а прозрачная липкая
      // полоса поверх картинки браузера читалась бы как грязь на экране.
      прибито = шапка;
      отметиться("pinned");
      return;
    }
  }

  function следить() {
    прибить();
    // Сессия появляется и исчезает по ходу работы, поэтому смотрим за
    // страницей, а не проверяем один раз при загрузке.
    try {
      new MutationObserver(прибить).observe(document.body,
                                            {childList: true, subtree: true});
    } catch (e) {
      setInterval(прибить, 1500);
    }
  }

  if (document.body) следить();
  else document.addEventListener("DOMContentLoaded", следить);
})();
</script>
