<!-- extella-проба: начало. Вставляется в страницу приложения установщиком кабинета,
     снимается вместе с ней. Ничего не меняет в самом приложении.

     ЗАЧЕМ ИЗНУТРИ. Приложение в окне ОС оказывается «третьей стороной», и WebKit
     закрывает ему хранилище: drawio от этого умирает с английской ошибкой, excalidraw
     открывается и молча теряет рисунки при закрытии. Проверить это снаружи нельзя —
     другое происхождение.

     ЗАЧЕМ НЕ ОТДЕЛЬНЫМ ФАЙЛОМ. Первый вариант клал рядом файл-разведчик. Он не
     сработал: excalidraw ставит service worker на весь порт, и ЛЮБОЙ адрес там
     отдаёт саму доску — разведчик не доезжал. Отвечать может только сама страница
     приложения. -->
<script>
(function () {
  var ок = false, причина = "";
  try {
    localStorage.setItem("__extella_проба", "1");
    localStorage.removeItem("__extella_проба");
    ок = true;
  } catch (e) {
    причина = String((e && e.name) || e).slice(0, 60);
  }
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "extella_проба", ок: ок, причина: причина }, "*");
    }
  } catch (e) {}
})();
</script>
<!-- extella-проба: конец -->
