<!DOCTYPE html>
<meta charset="utf-8">
<title>проба</title>
<script>
// РАЗВЕДЧИК. Лежит РЯДОМ С ПРИЛОЖЕНИЕМ, поэтому у него ровно те же права, что у
// приложения: то же происхождение, та же рамка, тот же браузер. Спрашивает одно —
// работает ли здесь хранилище — и говорит ответ странице-окну.
//
// ЗАЧЕМ. Приложение внутри чужой https-страницы попадает в «третью сторону»:
// WebKit закрывает такому окну хранилище наглухо. drawio от этого умирает с
// английской ошибкой «Error loading page», excalidraw выживает, но молча теряет
// рисунки при закрытии — а это хуже ошибки. Снаружи это не проверить: другое
// происхождение читать нельзя. Значит, спросить может только свой же файл изнутри.
(function () {
  var ок = false, причина = "";
  try {
    localStorage.setItem("__extella_проба", "1");
    localStorage.removeItem("__extella_проба");
    ок = true;
  } catch (e) {
    причина = String((e && e.name) || e).slice(0, 60);
  }
  try {
    parent.postMessage({ type: "extella_проба", ок: ок, причина: причина }, "*");
  } catch (e) {}
})();
</script>
