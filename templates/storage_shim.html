<!-- extella-проба: начало. Вставляется в страницу приложения установщиком кабинета
     и снимается начисто (tools/inject_probe.py). Чужой код не переписывается.

     ЧТО ДЕЛАЕТ. Даёт приложению хранилище, которое не зависит от браузера: работа
     ложится файлом на диск через свой же сервер (tools/cabinet_server.py).

     ЗАЧЕМ. В окне ОС приложение — «третья сторона», и браузер закрывает ему
     localStorage: drawio умирает с английской ошибкой, excalidraw открывается и
     молча теряет рисунки. Обход «откройте отдельным окном» перекладывает проблему
     на человека, поэтому его тут нет.

     ПОЧЕМУ ЧТЕНИЕ СИНХРОННОЕ. Приложение читает хранилище на старте, до того как
     мы успели бы что-то дождаться. Асинхронной подмены здесь не существует: либо
     данные есть в момент первого getItem, либо приложение считает, что их нет.
     Запросы идут на свой же адрес, это доли миллисекунды. -->
<script>
  // ── МАЯЧОК ДИАГНОСТИКИ ───────────────────────────────────────────────────
  // Окно ОС — чужая территория: консоли не видно, догадки дороги. Шим
  // отмечается у прокси обычной картинкой-запросом; в журнале службы
  // (--журнал) видно, докуда он дошёл и что увидел. Ничего не показывает
  // человеку и ничего не стоит, когда журнал выключен.
  // Адрес и имена полей — ЛАТИНИЦЕЙ. Кириллица в пути уезжает процентами
  // (/__%D1%88%D0%B8%D0%BC): совпадения на сервере не будет, и маячок молча
  // не доедет — ровно тот молчаливый отказ, ради поиска которого он и нужен.
  // В журнале такая строка вдобавок нечитаема. Русский остаётся в коде и в
  // пояснениях, но не в проводе (канон 4.5в).
  // Версию поднимать при каждой правке шима: по ней в журнале видно, какая
  // копия реально выполняется в окне (кэш браузера умеет показывать старую).
  var ВЕРСИЯ_ШИМА = "2026-08-23-6";

  // Сказать человеку ОДИН раз: почему часть приложения может не работать.
  var сказано_про_потоки = false;
  function сказать_про_потоки() {
    if (сказано_про_потоки) return;
    сказано_про_потоки = true;
    try {
      доложить(true, "в окне закрыты рабочие потоки — тяжёлый просмотр может " +
                     "не открыться; операции с файлом работают");
    } catch (е) {}
  }

  function отметиться(этап, что) {
    try {
      new Image().src = "/__shim?stage=" + encodeURIComponent(этап) +
                        "&what=" + encodeURIComponent(String(что).slice(0, 300));
    } catch (е) {}
  }
  try {
    отметиться("старт", "шим=" + ВЕРСИЯ_ШИМА + " origin=" + location.origin +
                        " путь=" + location.pathname);
  } catch (е) {}

  // ── КОДИРОВКА ТЕКСТОВЫХ ФАЙЛОВ ───────────────────────────────────────────
  // Приложение показывает html/txt/csv, отдавая файл во вложенную рамку как
  // временный адрес. Если у файла не указана кодировка, браузер выбирает её
  // сам — и для кириллицы выбирает НЕ ту: вместо «Журнал» человек видит
  // «Ð–ÑƒÑ€Ð½Ð°Ð»» (замер 22.08.2026, предпросмотр HTML в PDF-инструментах).
  // Дописываем кодировку сами: содержимое не трогаем, только помечаем.
  try {
    var родной_адрес = URL.createObjectURL.bind(URL);
    URL.createObjectURL = function (объект) {
      try {
        if (объект instanceof Blob) {
          var тип = String(объект.type || "");
          if (/^text\/|application\/(json|xml|xhtml)/.test(тип) &&
              тип.indexOf("charset") < 0) {
            объект = new Blob([объект], { type: тип + ";charset=utf-8" });
          }
        }
      } catch (е) {}
      return родной_адрес(объект);
    };
  } catch (е) {}

  // ── РАБОЧИЕ ПОТОКИ (Worker): МОСТ ВМЕСТО ОТКАЗА ─────────────────────────
  // ИСТОРИЯ ОШИБКИ, чтобы не повторить. Сначала я решил, что воркеры в окне
  // «мертвы»: маячок изнутри не приходил. Но маячок ходил СЕТЬЮ — а сеть
  // воркера в окне умирает сама: его запросы браузер тихо поднимает до https
  // («Mixed Content: … automatically upgraded», TLS-байты в наш http-порт —
  // замер 22.08.2026), которого у прокси нет. Молчание маячка доказывало
  // смерть сети, не смерть воркера — доказательство было круговым. А отказ
  // «мертвецам» убил и родной просмотрщик приложения.
  //
  // Честная схема: воркеров НЕ отказываем. Каждому вшиваем прелюдию-мост:
  //   * маячок жизни идёт СООБЩЕНИЕМ через канал (сеть не нужна вовсе);
  //   * fetch воркера при сбое уходит через страницу — у неё http работает.
  // Так родной движок приложения качает свой wasm через нас и собирается.
  try {
    var РодWorker = window.Worker;
    if (РодWorker) {
      // Признак песочницы окна (для спасателя и диагностики): временный
      // адрес здесь рождается без происхождения — «blob:null/…».
      var ВОРКЕРЫ_МЕРТВЫ = false;
      try {
        var пробный = URL.createObjectURL(new Blob([""], { type: "text/plain" }));
        ВОРКЕРЫ_МЕРТВЫ = пробный.indexOf("blob:null") === 0;
        URL.revokeObjectURL(пробный);
      } catch (е) {}
      var ФЛАГ_БЕЗ_ВОРКЕРОВ = (location.search + location.hash)
                                .indexOf("extella_no_workers") >= 0;

      // ── ПРОБЫ ГРАНИЦ ПЕСОЧНИЦЫ (только в ней; живым средам не мешаем) ────
      // Вопрос владельца 23.08.2026: «почему невозможно, неужели нет
      // обходов?» Правильный ответ добывается, а не утверждается. Три пробы
      // мимо нашей подмены, чистой платформой; итоги — маячками в журнал:
      //   probe-origin — НАСТОЯЩИЙ паспорт окна (self.origin, не location);
      //   probe-blob   — стартует ли работник из blob (наш нынешний путь);
      //   probe-data   — стартует ли работник из data: (запасная дверь:
      //                  у таких свой собственный паспорт по спецификации).
      // Если data живёт — переводим все воркеры на data:, и родной вьюер
      // оживает БЕЗ правки оболочки.
      if (ВОРКЕРЫ_МЕРТВЫ) {
        try { отметиться("probe-origin", String(self.origin)); } catch (е) {}
        var проба_воркера = function (имя, адрес) {
          try {
            var w = new РодWorker(адрес);
            var т = setTimeout(function () {
              отметиться("probe-" + имя, "создан, но молчит 4с");
              try { w.terminate(); } catch (е) {}
            }, 4000);
            w.onmessage = function () {
              clearTimeout(т); отметиться("probe-" + имя, "ЖИВ И ОТВЕТИЛ");
              try { w.terminate(); } catch (е) {}
            };
            w.onerror = function (e) {
              clearTimeout(т);
              отметиться("probe-" + имя, "ошибка: " +
                ((e && e.message) || "без описания").slice(0, 160));
            };
          } catch (е) {
            отметиться("probe-" + имя, "конструктор бросил: " + String(е.message).slice(0, 120));
          }
        };
        try {
          проба_воркера("blob", URL.createObjectURL(
            new Blob(["self.postMessage(1)"], { type: "text/javascript" })));
        } catch (е) {}
        try { проба_воркера("data", "data:text/javascript,self.postMessage(1)"); } catch (е) {}
      }

      // Тип воркера — по коду, не по вызову: скрипт pdf.js — ES-модуль
      // (import.meta), обычным воркером падает «Cannot use 'import.meta'
      // outside a module» (замер 22.08.2026).
      function тип_по_коду(код, опции) {
        var модуль = /\bimport\s*\.\s*meta\b/.test(код)
                  || /^\s*(import|export)\s/m.test(код);
        if (!модуль) return опции;
        var о = {};
        for (var к in (опции || {})) о[к] = опции[к];
        о.type = "module";
        return о;
      }

      // Прелюдия, выполняющаяся ПЕРВОЙ внутри воркера. Ждёт служебного
      // сообщения с портом (страница шлёт его сразу после создания — оно
      // первое в очереди), докладывает «жив» и берёт порт как запасную сеть:
      // родной fetch пробуется первым, мост — только по его отказу.
      var ПРЕЛЮДИЯ = [
        "(function(){",
        "  if (self.__extella_bridge) return; self.__extella_bridge = 1;",
        "  var порт = null, ном = 0, ждущие = {};",
        "  function приём(e){",
        "    var д = e.data || {};",
        "    if (д.__extella === 'ответ' && ждущие[д.id]) {",
        "      var ж = ждущие[д.id]; delete ждущие[д.id]; ж(д);",
        "    }",
        "  }",
        "  self.addEventListener('message', function (e) {",
        "    var д = e && e.data;",
        "    if (д && д.__extella_мост && e.ports && e.ports[0]) {",
        "      порт = e.ports[0];",
        "      порт.onmessage = приём;",
        "      порт.postMessage({ __extella: 'жив' });",
        "      while (ждут_порта.length) { try { ждут_порта.shift()(); } catch (х) {} }",
        "      if (e.stopImmediatePropagation) e.stopImmediatePropagation();",
        "    }",
        "  });",
        "  var ждут_порта = [];",
        "  function когда_порт(дело) {",
        "    if (порт) return дело();",
        "    ждут_порта.push(дело);   // гонка: fetch мог случиться до порта",
        "  }",
        "  function через_мост(вход, иниц) {",
        "    return new Promise(function (сдать, отказ) {",
        "      когда_порт(function () {",
        "      var id = 'з' + (++ном);",
        "      ждущие[id] = function (д) {",
        "        if (д.err) return отказ(new Error(д.err));",
        "        сдать(new Response(д.buf, { status: д.status || 200,",
        "          headers: { 'Content-Type': д.type || 'application/octet-stream' } }));",
        "      };",
        "      var url = (вход && вход.url) ? вход.url : String(вход);",
        "      порт.postMessage({ __extella: 'сеть', id: id, url: url,",
        "        method: (иниц && иниц.method) || (вход && вход.method) || 'GET' });",
        "      });",
        "    });",
        "  }",
        "  if (self.fetch) {",
        "    var родной_fetch = self.fetch.bind(self);",
        "    self.fetch = function (вход, иниц) {",
        "      return родной_fetch(вход, иниц)['catch'](function (е) {",
        "        try { if (порт) порт.postMessage({ __extella: 'заметка',",
        "          текст: 'fetch через мост: ' + ((вход && вход.url) || вход) }); } catch (х) {}",
        "        return через_мост(вход, иниц);",
        "      });",
        "    };",
        "  }",
        "  if (self.importScripts) {",
        "    var родной_imp = self.importScripts.bind(self);",
        "    self.importScripts = function () {",
        "      try { return родной_imp.apply(null, arguments); }",
        "      catch (е) {",
        "        try { if (порт) порт.postMessage({ __extella: 'заметка',",
        "          текст: 'importScripts не прошёл: ' +",
        "                 Array.prototype.join.call(arguments, ',') }); } catch (х) {}",
        "        throw е;",
        "      }",
        "    };",
        "  }",
        "})();"
      ].join("\n");

      // Страничная сторона моста: отвечает воркеру на сетевые просьбы своим
      // fetch (он ходит по http как надо) и пишет маячки в журнал прокси.
      function подключить_мост(w, метка, база) {
        try {
          var канал = new MessageChannel();
          // Больная точка перехостинга (ревью 22.08.2026, подтверждено): код
          // воркера переехал в blob, и его «адрес дома» стал blob:null/… —
          // и все его относительные пути умерли вместе с ним.
          var раскрыть = function (url) {
            url = String(url || "");
            // движок строит путь к wasm от СВОЕГО адреса: blob:null/x.wasm.
            // Такой адрес не перекачать — но хвост после blob:null/ это имя
            // файла рядом с настоящим скриптом. Возвращаем его домой.
            var м = url.match(/^blob:null\/(.+)$/);
            if (м && база) {
              try { return new URL(м[1], база).href; } catch (е) {}
            }
            if (!/^[a-z]+:/i.test(url) && база) {   // относительный — от базы
              try { return new URL(url, база).href; } catch (е) {}
            }
            return url;
          };
          канал.port1.onmessage = function (e) {
            var д = e.data || {};
            if (д.__extella === "жив") {
              отметиться("worker-alive", метка);
              if (w.__extella_адрес_блоба) {        // скрипт доехал — адрес больше не нужен
                try { URL.revokeObjectURL(w.__extella_адрес_блоба); } catch (х) {}
                w.__extella_адрес_блоба = null;
              }
              return;
            }
            if (д.__extella === "заметка") {
              отметиться("worker-note", String(д.текст || "").slice(0, 200)); return;
            }
            if (д.__extella !== "сеть") return;
            // Каскад адресов: раскрытый от базы, затем — по имени файла в
            // /assets/ (движок строит путь от своего blob-адреса, а его
            // настоящие файлы лежат в assets; замер 23.08.2026: возврат от
            // базы окна давал 404 на корне).
            var кандидаты = [раскрыть(д.url)];
            var имя = String(д.url || "").match(/^blob:null\/(.+)$/);
            if (имя) {
              try {
                кандидаты.push(new URL("/assets/" + имя[1], location.href).href);
              } catch (е) {}
            }
            (function попытка(н) {
              if (н >= кандидаты.length) {
                канал.port1.postMessage({ __extella: "ответ", id: д.id,
                  err: "не найден ни по одному адресу: " + кандидаты.join(" | ") });
                return;
              }
              fetch(кандидаты[н], { method: д.method || "GET" })
                .then(function (о) {
                  if (о.status >= 400 && н + 1 < кандидаты.length) return попытка(н + 1);
                  var тип = о.headers.get("content-type") || "";
                  return о.arrayBuffer().then(function (буф) {
                    канал.port1.postMessage({ __extella: "ответ", id: д.id,
                      status: о.status, type: тип, buf: буф }, [буф]);
                  });
                })
                ["catch"](function (е) {
                  if (н + 1 < кандидаты.length) return попытка(н + 1);
                  канал.port1.postMessage({ __extella: "ответ", id: д.id,
                    err: String((е && е.message) || е) });
                });
            })(0);
          };
          w.postMessage({ __extella_мост: 1 }, [канал.port2]);
          // Смерть воркера должна быть видна, а не молчать: до этой строки
          // мы ни разу не слушали его error-событие (пробел в диагностике).
          w.addEventListener("error", function (e) {
            отметиться("worker-error", метка + ": " +
              ((e && e.message) || "без описания").slice(0, 160));
          });
        } catch (е) { отметиться("bridge-fail", е && е.message); }
      }

      var НашWorker = function (адрес, опции) {
        var абс = String(адрес);
        try { абс = new URL(адрес, location.href).href; } catch (е) {}
        отметиться("worker", абс);
        if (ФЛАГ_БЕЗ_ВОРКЕРОВ) {           // только ручная проверка поведения
          отметиться("worker-refused", абс);
          throw new Error("рабочие потоки выключены флагом проверки");
        }
        // Достаём код воркера, чтобы вшить прелюдию. Не вышло — отдаём как
        // есть: пусть работает родной, хуже он не станет.
        var код = null, метка = "";
        // База воркера — каталог его НАСТОЯЩЕГО скрипта: от неё чинятся
        // относительные адреса и мёртвые blob:null/… из перехощенного кода.
        var база_воркера = location.href;
        try {
          if (абс.indexOf("blob:") === 0) {
            var b = new XMLHttpRequest();
            b.open("GET", абс, false); b.send(null);
            код = b.responseText || ""; метка = "blob";
            // Времянка-обёртка: маленький blob, внутри которого только
            // загрузка настоящего скрипта по адресу. Для blob-происхождения
            // тот адрес чужой и браузер его запретит — инлайним сами.
            var м = код.match(/importScripts\(\s*['"]([^'"]+)['"]/)
                 || код.match(/import\(\s*['"]([^'"]+)['"]/);
            if (м && /^https?:/.test(м[1]) && код.length < 4000) {
              var s = new XMLHttpRequest();
              s.open("GET", м[1], false); s.send(null);
              if (s.status >= 200 && s.status < 300 && s.responseText) {
                код = s.responseText; метка = "wrap"; база_воркера = м[1];
              }
            }
          } else if (/^https?:/.test(абс)) {
            var x = new XMLHttpRequest();
            x.open("GET", абс, false); x.send(null);
            if (x.status >= 200 && x.status < 300 && x.responseText) {
              код = x.responseText; метка = "url"; база_воркера = абс;
            }
          }
        } catch (е1) { отметиться("worker-read-fail", е1 && е1.message); код = null; }
        if (!код) return new РодWorker(адрес, опции);
        var адрес_блоба = URL.createObjectURL(
          new Blob([ПРЕЛЮДИЯ + "\n" + код], { type: "text/javascript" }));
        var w = new РодWorker(адрес_блоба, тип_по_коду(код, опции));
        // Утечка временных адресов (ревью 22.08.2026): каждый воркер оставлял
        // свой blob навсегда — по воркеру на документ это утечка без дна.
        // Отпускаем адрес, как только воркер доложил «жив» (скрипт доехал).
        w.__extella_адрес_блоба = адрес_блоба;
        setTimeout(function () {                     // страховка, если «жив» не пришёл
          if (w.__extella_адрес_блоба) {
            try { URL.revokeObjectURL(w.__extella_адрес_блоба); } catch (х) {}
            w.__extella_адрес_блоба = null;
          }
        }, 60000);
        подключить_мост(w, метка, база_воркера);
        отметиться("worker-bridged", метка);
        return w;
      };
      НашWorker.prototype = РодWorker.prototype;
      window.Worker = НашWorker;
    }
  } catch (е) {}

(function () {
  var АДРЕС = "/_extella_storage";

  // СЕДЬМАЯ ДВЕРЬ. В песочнице окна ОС само ЧТЕНИЕ navigator.serviceWorker
  // бросает SecurityError («…sandboxed and lacks the allow-same-origin flag»),
  // и загрузчик приложения умирает, не дойдя до дела. Замер 21.08.2026,
  // tududi: форма логина при рабочем автовходе, полоска с настоящей причиной
  // появилась только после crossorigin-пометки скриптов. Лечение: убрать
  // свойство вовсе («воркеров нет» — это умеют все), а если браузер не даёт —
  // тихая заглушка, которая ничего не обещает.
  try { void navigator.serviceWorker; } catch (е7) {
    try { delete Navigator.prototype.serviceWorker; } catch (е8) {}
    try { void navigator.serviceWorker; } catch (е9) {
      try {
        Object.defineProperty(Navigator.prototype, "serviceWorker", {
          configurable: true,
          get: function () {
            return {
              register: function () { return new Promise(function () {}); },
              getRegistrations: function () { return Promise.resolve([]); },
              addEventListener: function () {}, removeEventListener: function () {},
              ready: new Promise(function () {}), controller: null
            };
          }
        });
      } catch (е10) {}

            var в = JSON.parse(x.responseText || "{}").версия;
            if (typeof в !== "number" || в <= МОЯ_ВЕРСИЯ) { ждёт = false; return; }
            // Чужая правка. Насильная перезагрузка съедала незаписанный ввод
            // и сбрасывала ячейку — поэтому обновляем сами ТОЛЬКО когда человек
            // давно не трогал страницу; работает — предлагаем кнопкой, решает он.
            if (Date.now() - последнее_касание > БЕЗДЕЙСТВИЕ) {
              try { window.parent.postMessage({type: "extella_перечитать"}, "*"); } catch (е2) {}
              try { location.reload(); } catch (е3) {}
            } else if (!ждёт) {
              ждёт = true;
              try { window.parent.postMessage({type: "extella_обновление_ждёт"}, "*"); } catch (е4) {}
            }
          } catch (e) {}
        };
        x.send(null);
      } catch (e) {}
    }, ПАУЗА);
  })();

  var толчок = function () { try { window.dispatchEvent(new Event("resize")); } catch (e) {} };
  [120, 600, 1500, 3000].forEach(function (мс) { setTimeout(толчок, мс); });
  window.addEventListener("load", толчок);
  // Появилось внимание к окну — рисуем сразу, не дожидаясь следующего срока.
  document.addEventListener("visibilitychange", толчок);
  window.addEventListener("focus", толчок);
})();
</script>
