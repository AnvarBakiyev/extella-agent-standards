<!-- extella-проба: начало. Вставляется в страницу приложения установщиком кабинета
     и снимается начисто (tools/inject_probe.py). Чужой код не переписывается.

     ЧТО ДЕЛАЕТ. Даёт приложению хранилище, которое не зависит от браузера: работа
     ложится файлом на диск через свой же сервер (tools/cabinet_server.py).

     ЗАЧЕМ. В окне ОС приложение — «третья сторона», и браузер закрывает ему
     localStorage: drawio умирает с английской ошибкой, excalidraw открывается и
     молча теряет рисунки. Обход «откройте отдельным окном» перекладывает проблему
     на человека, поэтому его тут нет.

     ПОЧЕМУ ЧТЕНИЕ СИНХРОННОЕ. Приложение читает хранилище на старте, до того как
     мы успели бы что-то дождаться. Асинхронной подмены здесь не существует: либо
     данные есть в момент первого getItem, либо приложение считает, что их нет.
     Запросы идут на свой же адрес, это доли миллисекунды. -->
<script>
(function () {
  var АДРЕС = "/_extella_storage";

  // СЕДЬМАЯ ДВЕРЬ. В песочнице окна ОС само ЧТЕНИЕ navigator.serviceWorker
  // бросает SecurityError («…sandboxed and lacks the allow-same-origin flag»),
  // и загрузчик приложения умирает, не дойдя до дела. Замер 21.08.2026,
  // tududi: форма логина при рабочем автовходе, полоска с настоящей причиной
  // появилась только после crossorigin-пометки скриптов. Лечение: убрать
  // свойство вовсе («воркеров нет» — это умеют все), а если браузер не даёт —
  // тихая заглушка, которая ничего не обещает.
  try { void navigator.serviceWorker; } catch (е7) {
    try { delete Navigator.prototype.serviceWorker; } catch (е8) {}
    try { void navigator.serviceWorker; } catch (е9) {
      try {
        Object.defineProperty(Navigator.prototype, "serviceWorker", {
          configurable: true,
          get: function () {
            return {
              register: function () { return new Promise(function () {}); },
              getRegistrations: function () { return Promise.resolve([]); },
              addEventListener: function () {}, removeEventListener: function () {},
              ready: new Promise(function () {}), controller: null
            };
          }
        });
      } catch (е10) {}
    }
  }

  // СНИМАЕМ ЧУЖОЙ ПЕРЕХВАТЧИК СТРАНИЦ. Приложение могло раньше поставить свой
  // service worker на весь порт — он переживает удаление файлов и продолжает
  // отдавать СТАРУЮ копию из кэша: правки не доезжают, а окно может остаться
  // белым. Переименовать файлы мало — регистрация живёт в браузере отдельно.
  // Снимаем её явно и чистим кэши; на работу приложения это не влияет — всё
  // и так лежит на этом компьютере.
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (список) {
        (список || []).forEach(function (р) { try { р.unregister(); } catch (e) {} });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (имена) {
        (имена || []).forEach(function (и) { try { caches.delete(и); } catch (e) {} });
      }).catch(function () {});
    }
  } catch (e) {}

  function родное_работает() {
    try {
      window.localStorage.setItem("__extella_проба", "1");
      window.localStorage.removeItem("__extella_проба");
      return true;
    } catch (e) { return false; }
  }

  var данные = {};
  var живо = false;
  var как = "";
  try {
    var x = new XMLHttpRequest();
    x.open("GET", АДРЕС, false);          // синхронно и намеренно, см. выше
    x.send(null);
    как = "статус " + x.status;
    if (x.status === 200) { данные = JSON.parse(x.responseText || "{}"); живо = true; }
  } catch (e) { как = "запрос отклонён (" + ((e && e.name) || e) + ")"; }

  // Докладываем ВСЕГДА, даже когда не получилось. Молчание в прошлый раз стоило
  // часа поисков: окно не могло отличить «всё хорошо» от «скрипт не выполнился».
  function доложить(ок, причина) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "extella_проба", ок: ок, причина: причина }, "*");
      }
    } catch (e) {}
  }
  if (!живо) доложить(false, "хранилище кабинета недоступно: " + как);

  // Сервер кабинета не отвечает — не трогаем ничего: пусть приложение работает
  // со своим родным хранилищем, как умеет. Ломать рабочее ради страховки нельзя.
  if (!живо) return;

  // Своя версия работы. Приложение, открытое в окне, держит сцену в памяти и
  // пишет её целиком — поэтому оно ЗАТИРАЕТ то, что записал агент, пока окно
  // было открыто. Замер 17.08.2026: нарисованное агентом правило исчезло ровно
  // так. Считаем версии: своя запись поднимает счётчик и у нас, чужая — только
  // у сервера, и тогда работу надо перечитать.
  var МОЯ_ВЕРСИЯ = (данные && данные._версия) || 0;
  var в_полёте = 0;
  delete данные._версия;

  function записать(тело) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", АДРЕС, true);
      x.setRequestHeader("Content-Type", "application/json");
      x.onload = function () {
        try { МОЯ_ВЕРСИЯ = JSON.parse(x.responseText || "{}").версия || МОЯ_ВЕРСИЯ; }
        catch (e) {}
      };
      в_полёте++;
      x.onloadend = function () { в_полёте = Math.max(0, в_полёте - 1); };
      x.send(JSON.stringify(тело));
    } catch (e) {}
  }

  var хранилище = {
    getItem: function (k) {
      k = String(k);
      return Object.prototype.hasOwnProperty.call(данные, k) ? данные[k] : null;
    },
    setItem: function (k, v) { данные[String(k)] = String(v); записать({ ключ: String(k), значение: String(v) }); },
    removeItem: function (k) { delete данные[String(k)]; записать({ ключ: String(k), значение: null }); },
    clear: function () { данные = {}; записать({ очистить: true }); },
    key: function (i) { var к = Object.keys(данные); return i < к.length ? к[i] : null; },
    get length() { return Object.keys(данные).length; }
  };

  // Если родное хранилище работает (приложение открыто само по себе), переносим
  // из него то, что уже накопилось: человек не должен потерять вчерашнюю работу
  // из-за того, что мы поменяли способ хранения.
  if (родное_работает()) {
    try {
      for (var i = 0; i < window.localStorage.length; i++) {
        var к = window.localStorage.key(i);
        if (к && !Object.prototype.hasOwnProperty.call(данные, к)) {
          хранилище.setItem(к, window.localStorage.getItem(к));
        }
      }
    } catch (e) {}
  }

  try {
    Object.defineProperty(window, "localStorage", {
      value: хранилище, configurable: true, writable: false
    });
  } catch (e) {}

  // ЧЕТВЁРТАЯ ДВЕРЬ — История браузера. Песочница запрещает pushState и
  // replaceState, а роутер одностраничного приложения зовёт их при первом же
  // вздохе — и умирает в цикле SecurityError. Замер 20.08.2026: Сторож
  // (Uptime Kuma, vue-router) был белым именно об это, хранилище тут ни при
  // чём. Подменяем на безопасные: пробуем родной, отказ глотаем — адрес в
  // строке просто не меняется, приложению этого достаточно.
  try {
    var род_push = history.pushState.bind(history);
    var род_замена = history.replaceState.bind(history);
    history.pushState = function () {
      try { return род_push.apply(null, arguments); } catch (е) {}
    };
    history.replaceState = function () {
      try { return род_замена.apply(null, arguments); } catch (е) {}
    };
  } catch (е) {}

  // sessionStorage браузер закрывает тем же махом. Он не переживает перезапуск и
  // на диск не пишется — достаточно памяти, лишь бы приложение не падало.
  try {
    window.sessionStorage.setItem("__extella_проба", "1");
    window.sessionStorage.removeItem("__extella_проба");
  } catch (e) {
    var память = {};
    try {
      Object.defineProperty(window, "sessionStorage", {
        configurable: true, writable: false, value: {
          getItem: function (k) { return Object.prototype.hasOwnProperty.call(память, String(k)) ? память[String(k)] : null; },
          setItem: function (k, v) { память[String(k)] = String(v); },
          removeItem: function (k) { delete память[String(k)]; },
          clear: function () { память = {}; },
          key: function (i) { var к = Object.keys(память); return i < к.length ? к[i] : null; },
          get length() { return Object.keys(память).length; }
        }
      });
    } catch (e2) {}
  }

  // Падение приложения не должно выглядеть как пустое окно: окно ОС получит
  // причину и покажет её человеку по-русски.
  function сбой(причина) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: "extella_сбой", причина: String(причина || "ошибка").slice(0, 200)
        }, "*");
      }
    } catch (x) {}
  }
  // Одного сообщения мало: у падений вроде «Uncaught» оно пустое и не говорит
  // НИЧЕГО. Замер 16.08.2026: два круга правок ушли впустую, потому что причина
  // была обрезана до одного слова. Собираем всё, что есть: где упало и стек.
  window.addEventListener("error", function (е) {
    var о = е && е.error;
    if (о && о.__extella_ожидаемо) return;      // свой отказ — не падение
    // Подглядывание за родительским окном (scrollY и прочее) песочница
    // запрещает, но приложение от этого НЕ умирает — оно работает дальше.
    // Докладывать такой шум как «не смогло запуститься» — ложная тревога
    // при живом приложении. Замер 20.08.2026: Сторож с тремя зелёными
    // мониторами и красной полоской о собственной смерти.
    if (String((е && е.message) || (о && о.message) || "").indexOf("cross-origin frame") >= 0) return;
    // Тот же класс шума от двери IndexedDB: подмена говорит «баз нет»
    // (undefined), а сборки зовут indexedDB.open без проверки — TypeError
    // «reading 'open'». Приложение живёт дальше на подменённом хранилище.
    // Замер 20.08.2026: Доска схем работала, а полоска её хоронила.
    if (/undefined \(reading '(open|databases|deleteDatabase)'\)/.test(
        String((е && е.message) || (о && о.message) || ""))) return;
    var части = [];
    if (е && е.message) части.push(String(е.message));
    if (о && о.name && String(е.message || "").indexOf(о.name) < 0) части.push(о.name);
    if (о && о.message) части.push(о.message);
    if (е && е.filename) {
      части.push(String(е.filename).split("/").pop() + ":" + (е.lineno || "?"));
    }
    if (о && о.stack) {
      var строка = String(о.stack).split("\n").filter(function (с) {
        return с && с.indexOf("at ") >= 0;
      })[0];
      if (строка) части.push(строка.trim().slice(0, 90));
    }
    сбой(части.join(" · ") || "падение без описания");
  });
  // Оборванное обещание — тоже падение, просто тихое. Приложение при этом
  // «живо», но экран остаётся пустым, и без этого доклада причина не видна.
  window.addEventListener("unhandledrejection", function (е) {
    var р = е && е.reason;
    // Наш собственный вежливый отказ — не падение приложения, а объявленное
    // состояние песочницы. Молчим о нём здесь: о нём уже сказано отдельно.
    if (р && р.__extella_ожидаемо) return;
    // Дверь IndexedDB, см. фильтр выше: тот же шум приезжает и обещанием.
    if (/undefined \(reading '(open|databases|deleteDatabase)'\)/.test(
        String((р && р.message) || ""))) return;
    сбой((р && (р.message || р)) || "оборванное обещание");
  });

  // ── COOKIE В ПЕСОЧНИЦЕ ───────────────────────────────────────────────────
  // Окно ОС открывает продукт в песочнице БЕЗ общего происхождения — намеренно,
  // чтобы чужой HTML не дотянулся до окна покупателя и его токена. В таком
  // документе чтение document.cookie не возвращает пустоту, а БРОСАЕТ
  // SecurityError. Приложение падает на первой же строке, где к нему обратилось.
  // Замер 16.08.2026: Доска схем падала ровно так — «Failed to read the cookie
  // property from Document: the document is sandboxed and lacks the
  // allow-same-origin flag», экран белый, причина в консоли, которой нет.
  // Подменяем на честную банку в памяти: приложение работает, а хранить в
  // cookie в песочнице всё равно нечего.
  var cookie_закрыт = false;
  try {
    void document.cookie;
  } catch (e) {
    cookie_закрыт = true;
    var банка = {};
    try {
      Object.defineProperty(document, "cookie", {
        configurable: true,
        get: function () {
          return Object.keys(банка).map(function (к) { return к + "=" + банка[к]; }).join("; ");
        },
        set: function (строка) {
          var пара = String(строка).split(";")[0];
          var знак = пара.indexOf("=");
          if (знак <= 0) return;
          var имя = пара.slice(0, знак).trim();
          var значение = пара.slice(знак + 1).trim();
          // Срок в прошлом означает удаление — ведём себя как настоящая банка.
          if (/expires=[^;]*1970|max-age=0/i.test(String(строка))) delete банка[имя];
          else банка[имя] = значение;
        }
      });
    } catch (x) {}
  }

  // ── БАЗЫ БРАУЗЕРА (IndexedDB) В ЧУЖОМ ОКНЕ ──────────────────────────────
  // В окне ОС приложение — «третья сторона», и браузер закрывает ему не только
  // простое хранилище, но и базы. Разница смертельна: простое хранилище просто
  // не отдаёт данные, а базы БРОСАЮТ ИСКЛЮЧЕНИЕ на первом же обращении, и
  // приложение падает целиком. Замер 16.08.2026: Доска схем в окне ОС падала с
  // пустым «Uncaught» и белым экраном, хотя подмена простого хранилища работала.
  //
  // Заглушка не притворяется рабочей базой: она отказывает ВЕЖЛИВО, событием
  // вместо исключения. Приложение видит «баз нет» — это состояние обычное
  // (режим инкогнито), и переживают его почти все. Работа при этом не теряется:
  // сама схема живёт в простом хранилище, а оно уведено на диск.
  var базы_закрыты = false;
  try {
    var прб = window.indexedDB.open("__extella_проба_баз");
    прб.onsuccess = function () {
      try { прб.result.close(); window.indexedDB.deleteDatabase("__extella_проба_баз"); } catch (e) {}
    };
    прб.onerror = function () {};
  } catch (e) {
    базы_закрыты = true;
    // Помечаем СВОЙ отказ: он ожидаемый, и путать его с падением приложения
    // нельзя. Замер 16.08.2026: непомеченный отказ доезжал до окна как
    // «приложение не смогло запуститься» — при полностью работающей доске.
    // Заглушка-«вежливый отказ» (событием onerror) прожила два дня и умерла об
    // localforage внутри Luckysheet: тот ждёт от запроса большего, чем мы
    // изображали, и его обещание готовности не разрешается НИКОГДА — приложение
    // висит на Loading при уже построенной сетке. Замер 19.08.2026, Таблица в
    // окне ОС; изображать базы точнее — погоня без конца.
    // Честнее, чтобы баз НЕ БЫЛО ВОВСЕ: undefined — состояние из инкогнито
    // и старых браузеров, его обрабатывает каждая библиотека с первой строки
    // (typeof indexedDB === "undefined" → сразу запасной путь, без обещаний).
    try {
      Object.defineProperty(window, "indexedDB", { configurable: true, value: undefined });
    } catch (x) {}
  }

  var закрыто = [];
  if (cookie_закрыт) закрыто.push("cookie");
  if (базы_закрыты) закрыто.push("базы браузера");
  доложить(true, закрыто.length
    ? "в песочнице закрыто: " + закрыто.join(", ") + " — работа хранится на диске"
    : "");

  // ТОЛЧОК К ПЕРЕРИСОВКЕ. Приложения на холсте (excalidraw и подобные) рисуют
  // бережно: ждут события и пропускают кадры, пока окно считается ненужным.
  // Во встроенном окне такого события может не случиться вовсе — приложение
  // живое, доложило о себе, а человек смотрит в белое. Замер 16.08.2026:
  // доска на 179 элементов появлялась только со второго кадра.
  // Событие размера — то, на которое такие приложения перерисовываются всегда.
  // СЛЕЖЕНИЕ ЗА ЧУЖИМИ ПРАВКАМИ. Раз в несколько секунд спрашиваем сервер
  // дёшево: «версия та же?». Если работу поменял кто-то другой — агент, второе
  // окно, — перечитываем страницу. Без этого открытое окно молча затирает
  // чужую работу своей памятью, и человек видит, как нарисованное исчезает.
  // Перезагружаем, только когда человек ничего не делает: иначе отберём у него
  // руку посреди штриха.
  (function следить() {
    var ПАУЗА = 3000, БЕЗДЕЙСТВИЕ = 20000;
    var последнее_касание = 0, ждёт = false;
    ["pointerdown", "keydown", "wheel"].forEach(function (с) {
      window.addEventListener(с, function () { последнее_касание = Date.now(); }, true);
    });
    setInterval(function () {
      // Своя запись в полёте: серверная версия сейчас честно вырастет от НАС —
      // опрос в этот момент ловил собственное сохранение как «чужую правку» и
      // перезагружал страницу посреди набора. Слово Анвара 21.08.2026:
      // «печатаешь — слетает». Ждём, пока свои записи долетят.
      if (в_полёте > 0) return;
      try {
        var x = new XMLHttpRequest();
        x.open("GET", "/_extella_version", true);
        x.onload = function () {
          try {
            var в = JSON.parse(x.responseText || "{}").версия;
            if (typeof в !== "number" || в <= МОЯ_ВЕРСИЯ) { ждёт = false; return; }
            // Чужая правка. Насильная перезагрузка съедала незаписанный ввод
            // и сбрасывала ячейку — поэтому обновляем сами ТОЛЬКО когда человек
            // давно не трогал страницу; работает — предлагаем кнопкой, решает он.
            if (Date.now() - последнее_касание > БЕЗДЕЙСТВИЕ) {
              try { window.parent.postMessage({type: "extella_перечитать"}, "*"); } catch (е2) {}
              try { location.reload(); } catch (е3) {}
            } else if (!ждёт) {
              ждёт = true;
              try { window.parent.postMessage({type: "extella_обновление_ждёт"}, "*"); } catch (е4) {}
            }
          } catch (e) {}
        };
        x.send(null);
      } catch (e) {}
    }, ПАУЗА);
  })();

  var толчок = function () { try { window.dispatchEvent(new Event("resize")); } catch (e) {} };
  [120, 600, 1500, 3000].forEach(function (мс) { setTimeout(толчок, мс); });
  window.addEventListener("load", толчок);
  // Появилось внимание к окну — рисуем сразу, не дожидаясь следующего срока.
  document.addEventListener("visibilitychange", толчок);
  window.addEventListener("focus", толчок);
})();
</script>
<!-- extella-проба: конец -->
