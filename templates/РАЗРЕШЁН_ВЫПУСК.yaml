# Допуск на выпуск (H116). Кладётся в корень продукта рядом с релизным гейтом.
#
# Смысл: человек один раз называет границу, внутри которой чат доставляет покупателю
# сам — со следом и путём назад. Вне границы по-прежнему нужен человек.
# Проверяется машиной: python3 tools/check_release_license.py --допуск РАЗРЕШЁН_ВЫПУСК.yaml
#
# Отзыв допуска = удалить строку продукта. Срок можно не ставить; если поставлен —
# после него гейт откажет сам.

версия_формата: 1
выдал: Имя Фамилия
дата: 2026-01-01
аккаунт: почта@аккаунта            # чей живой аккаунт трогаем
# действует_до: 2026-12-31         # необязательно

продукты:
  - продукт: Название продукта
    листинг: 00000000-0000-0000-0000-000000000000
    эксперты:                      # префиксы имён; допуск без имён ничего не ограничивает
      - префикс_
    версии: pre                    # pre — только предварительные; любой — снять ограничение
    цена: 0
    потолок_версий_в_сутки: 6      # выше — только с человеком, чтобы цикл не выпускал бесконечно
    откат: evidence/откат/продукт  # куда кладётся код экспертов ДО перезаписи

# Пределы допуска. Их гейт не разрешает никогда — только человек, отдельно и на раз.
всегда_у_человека:
  - первый платный выпуск и любая смена цены
  - продукты, которые ведут другие люди (ВЕДУТ_ДРУГИЕ.txt)
  - удаление версий и листингов (скрытие — можно)
  - расширение прав приложения (app_scopes): за них отвечает согласие покупателя
  - выпуск при красном гейте или без сохранённого отката
