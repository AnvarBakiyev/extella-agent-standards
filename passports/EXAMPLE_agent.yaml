# ОБРАЗЕЦ паспорта агента — для чтения и копирования.
#
# Паспорта живых продуктов в этом репозитории НЕ хранятся: они раскрывают состав
# аккаунта компании. Свои паспорта держите там, где вам удобно, и указывайте путь
# переменной EXTELLA_PASSPORTS_DIR — гейты (`check_agent_drift`,
# `build_capability_registry`) читают её. Без неё сверка дрейфа честно сообщает,
# что паспортов не нашла, и ничего не проверяет.
#
# Файлы с именем EXAMPLE* гейтами пропускаются намеренно.

---
# Паспорт написан 29.07.2026 ПО ФАКТУ: права и модель сняты живым agent/get, а не взяты
# из документа. Решение Анвара — сначала фотография, потом уборка.
agent:
  name: "Example agent"
  platform_agent_id: "agent_EXAMPLE0000000000"  # canon-ok: паспорт описывает ИМЕННО этого агента
  owner: "Анвар (CEO Extella)"
  business_goal: "Подбирает и бронирует туры для примерна: живой поиск по Tourvisor, ответы клиенту, контроль заявок."
  model_profile: "qwen-3.7"        # живая модель: qwen3.7-max-2026-06-08
  version: "0.1.0"
  languages: ["ru", "en"]
  hosting_profile: "client_server"
  immutable_bundle_id: "pack-62997fe"
  daex_classification: "personal_example_pii"

capabilities:
  - name: "example_main"
    version: "0.1.0"
    what: "Подбирает и бронирует туры для примерна: живой поиск по Tourvisor, ответы клиенту, контроль заявок."
    kind: "expert"
    ref: "ex_wa_inbound_tick"
    scope: "agent"
    global: false
    permissions: []
    targets: []
    retry_policy: "none"
    rollback: "Восстановить инструкции из adoption_wizard/*_instructions.md и прошить агента целиком."
    help_surface: "adoption_wizard/README_ADOPTION_WIZARD.md"
    limits:
      - "НЕ отправляет письма и не пишет наружу сам — только черновики, отправляет человек"
      - "НЕ проверено на живых данных клиента"

operations:
  rollback: "Агент заморожен (F2). Откат — прошивка инструкций из файла целиком."

optional:
  agent:
    # Факт против намерения: канон требует урезанных прав, живой агент их шире.
    observed_tools_count: 48
    observed_dangerous_tools:
      - "token_generate_mcp_extella"
    drift_note: "У агента есть token_generate — право выпустить токен доступа к аккаунту.
      Это шире, чем нужно для его задачи. Урезание — решение Анвара (прод заморожен, F2)."

shared_genes:
  # Первый РЕАЛЬНЫЙ общий ген Agent Genome. Выбран по живому замеру 07.08.2026: это
  # правило лежит у ВСЕХ шести агентов аккаунта побайтно одинаковым текстом — 986
  # символов, sha256 6e37a0ca4d21ca62f99684a1a50f9e302db78ae6f32fd80d67d33480cd5d3bd6.
  # Фиктивный объект не добавлялся: ген объявляет то, что уже работает у людей.
  #
  # Почему именно это правило: оно запрещает агенту трогать файлы самой Extella без
  # явного подтверждения. Изменение такого текста — ровно тот случай, когда сравнение
  # «до и после» в Evolution Lab обязательно, а не желательно.
  #
  # ГРАНИЦА, которую надо знать: у всех живых копий rule_id = null. Ген читается и
  # аттестуется, но `rules/update` до него не доходит — активация изменения потребует
  # адресуемых записей на платформе.
  - gene_id: "rule.filesystem_self_protection"
    kind: "rule"
    name: "Защита файлов Extella"
    version: "1.0.0"          # первая аттестованная версия текста с sha256 выше
    provenance: "global"
